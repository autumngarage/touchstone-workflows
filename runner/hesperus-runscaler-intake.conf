# Drop-in for the already-qualified optional control-pool service. The release
# hesperus-runner.service and its four slots are intentionally independent.
[Service]
ExecStart=
ExecStart=/bin/bash /opt/hesperus-runner/native/runscaler-intake.sh
KillMode=mixed
# A native validation group can run for 60 minutes. Drain its one guest,
# including bounded reconciliation, before systemd ends the controller.
TimeoutStopSec=65min
