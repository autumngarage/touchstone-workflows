name: validate

# Central required validation for Touchstone. GitHub executes this immutable
# source against the target pull request, outside that PR's control.
#
# DEPENDENCY CONTRACT: this job may depend on the runner image, the target
# repository, and github.com. Nothing else. Anything no test executes is not
# installed here.

on:
  # Consumers may invoke this same validator on their default branch to
  # produce a cache that later PR and merge-queue runs can restore.
  workflow_call:
    inputs:
      # For the cache seed alone. A seed that starts with no cache to restore
      # (a new runner architecture, a changed package graph) builds everything
      # from nothing, and on a hosted runner that takes longer than a pull
      # request's limit; the limit then cancels the only run that could have
      # saved the cache, and every later run starts just as cold (AUT-2174).
      # Pull requests, pushes, and the merge queue never pass an input, so
      # they keep the default.
      timeout_minutes:
        description: Job time limit in minutes. Raise it only for a cache seed that may build cold.
        type: number
        default: 30
      blacksmith:
        description: Run an explicit Linux trial on Blacksmith instead of the default runner.
        type: boolean
        default: false
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [main]
  # The merge queue tests the merged result on a temporary commit; the
  # required check must report there or every queue entry is ejected.
  merge_group:
    types: [checks_requested]

# One validation per pull request at a time. A newer push supersedes the older
# head's run, which would otherwise finish and bill for a verdict nobody reads
# (AUT-1591). A merge-queue run is never cancelled: the queue owns that
# verdict, and each queue entry has its own ref, so no two share a group.
concurrency:
  group: validate-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  source-contract:
    # Required workflows do not run against their source repository. This job
    # keeps changes to the adapter reviewable without adding work to consumers.
    if: github.repository == 'autumngarage/touchstone-workflows'
    name: source contract
    # Runs this repository's candidate tests, so it never takes the
    # LINUX_RUNNER setting; see "Runner" in README.md.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout workflow source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Fetch declared validation engine
        run: |
          set -euo pipefail
          engine_revision="$(jq -er '.validationEngine.revision' .touchstone-source-contract.json)"
          engine_sha256="$(jq -er '.validationEngine.sha256' .touchstone-source-contract.json)"
          engine_path="$(jq -er '.validationEngine.path' .touchstone-source-contract.json)"
          validator="$RUNNER_TEMP/touchstone-run.sh"
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/autumngarage/touchstone/${engine_revision}/${engine_path}" \
            --output "$validator"
          printf '%s  %s\n' "$engine_sha256" "$validator" | sha256sum --check --strict
          printf 'TOUCHSTONE_ENGINE_PATH=%s\n' "$validator" >>"$GITHUB_ENV"

      - name: Test workflow contract
        run: bash tests/test-workflow.sh

  plan:
    # Reads the candidate's declaration through the pinned engine to learn
    # its execution groups. Executes no candidate code. GitHub excludes
    # required workflows from their source repository; mirror that here.
    if: github.repository != 'autumngarage/touchstone-workflows'
    name: validate plan
    # Trusted declaration parsing uses the lightweight gate pool, not build slots.
    runs-on: ${{ vars.LINUX_GATE_RUNNER && fromJSON(format('["self-hosted","{0}"]', vars.LINUX_GATE_RUNNER)) || 'ubuntu-latest' }}
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Checkout target repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Fetch pinned Touchstone validator
        run: |
          set -euo pipefail
          touchstone_revision="d2031284cff02a088a04987e0327f71e058c79ba"
          touchstone_sha256="9de43e0c028ad6e4771b47338cbd88b0aab3d17600ab401ca17f17dfd4f9d5ef"
          validator="$RUNNER_TEMP/touchstone-run.sh"
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/autumngarage/touchstone/${touchstone_revision}/scripts/touchstone-run.sh" \
            --output "$validator"
          printf '%s  %s\n' "$touchstone_sha256" "$validator" | sha256sum --check --strict

      - name: Plan validation groups
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          contract="$(bash "$RUNNER_TEMP/touchstone-run.sh" validate \
            --project "$GITHUB_WORKSPACE" \
            --check-contract \
            --json)"
          # Cache seeds stay one serial run: the saved build products must
          # come from a single complete validation. An engine whose
          # contract carries no groups inventory also runs serially, so
          # this workflow keeps working against older pinned engines.
          # Reusable workflows keep the caller's event, including manual seeds.
          if [ "$EVENT_NAME" = workflow_call ] || [ "$EVENT_NAME" = push ] || [ "$EVENT_NAME" = workflow_dispatch ]; then
            matrix='{"include":[{"name":"all","group":""}]}'
          else
            matrix="$(printf '%s' "$contract" | jq -c '
              if (.groups // [] | length) == 0
              then {"include":[{"name":"all","group":""}]}
              else {"include":[.groups[] | {"name":.name,"group":.name}]}
              end')"
          fi
          printf 'matrix=%s\n' "$matrix" >>"$GITHUB_OUTPUT"

  validate-groups:
    # GitHub excludes required workflows from their source repository. Mirror
    # that boundary for this file's ordinary pull_request/push triggers.
    if: github.repository != 'autumngarage/touchstone-workflows'
    needs: plan
    # No display name: a templated one would breach the source contract's
    # literal job-name guard, and GitHub already appends each shard's
    # matrix values (its group name) to the job ID in the check list.
    # Executes the candidate's own declared commands, so it may leave
    # GitHub-hosted runners only for single-use ones: LINUX_RUNNER names the
    # runners runner/linux-runner.sh registers for exactly one job in a
    # throwaway container, and nothing else (AUT-1596). See "Runner" in
    # README.md. Every event but the merge queue also requires
    # LINUX_RUNNER-shared, so slots the runner reserves for the queue
    # (LINUX_RUNNER_QUEUE_SLOTS) take only its jobs (AUT-2704).
    # Repository opt-in chooses the hosted fallback; selected local pools still win.
    runs-on: ${{ inputs.blacksmith && 'blacksmith-4vcpu-ubuntu-2404' || (vars.LINUX_RUNNER && fromJSON(format(github.event_name == 'merge_group' && '["self-hosted","{0}"]' || '["self-hosted","{0}","{0}-shared"]', vars.LINUX_RUNNER))) || (vars.BLACKSMITH_LINUX == 'true' && 'blacksmith-4vcpu-ubuntu-2404') || 'ubuntu-latest' }}
    # Two-CPU hosted Swift builds can spend 20 minutes compiling before tests.
    # Allow a bounded cold run; local and non-Swift jobs retain 30 minutes.
    timeout-minutes: ${{ inputs.timeout_minutes || ((inputs.blacksmith || vars.LINUX_RUNNER == '') && vars.SWIFT_BUILD_CACHE == 'true' && 60 || 30) }}
    strategy:
      # Every shard runs to completion: the aggregator needs each group's
      # own verdict, and one failing group must not cancel the evidence
      # from the others. Two shards at a time keeps a self-hosted pool's
      # remaining slots available to other candidates.
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout target repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config --global user.email "ci@touchstone.invalid"
          git config --global user.name "Touchstone CI"
          git config --global init.defaultBranch main

      - name: Identify optional Swift build cache
        id: swift-cache
        if: vars.SWIFT_BUILD_CACHE == 'true' && runner.os == 'Linux' && hashFiles('Package.resolved') != ''
        env:
          CACHE_OS: ${{ runner.os }}
          CACHE_ARCH: ${{ runner.arch }}
          CACHE_GRAPH: ${{ hashFiles('**/Package.swift', '**/Package.resolved', '.touchstone.toml', 'scripts/ci-setup-swift.sh', 'scripts/swift-check.sh') }}
          CACHE_REVISION: ${{ github.sha }}
          CACHE_EVENT: ${{ github.event_name }}
          CACHE_REF: ${{ github.ref }}
          CACHE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if ! command -v swift >/dev/null 2>&1; then
            echo "Swift cache skipped: the runner has no preinstalled toolchain."
            exit 0
          fi
          toolchain="$(swift --version | sha256sum | cut -d ' ' -f 1)"
          prefix="swiftpm-build-v1-${CACHE_OS}-${CACHE_ARCH}-${toolchain}-${CACHE_GRAPH}-"
          printf 'enabled=true\ntoolchain=%s\nprefix=%s\nkey=%s%s\n' \
            "$toolchain" "$prefix" "$prefix" "$CACHE_REVISION" >>"$GITHUB_OUTPUT"
          save=false
          if [ -n "$CACHE_DEFAULT_BRANCH" ] && [ "$CACHE_REF" = "refs/heads/$CACHE_DEFAULT_BRANCH" ]; then
            case "$CACHE_EVENT" in
              push|workflow_dispatch) save=true ;;
            esac
          fi
          printf 'save=%s\n' "$save" >>"$GITHUB_OUTPUT"

      # On the Mac's single-use runners the job image can hold the products
      # of this repository's last cache seed (runner/linux-runner.sh,
      # LINUX_RUNNER_CACHE_SEED; AUT-2672). Taken only when the recorded key
      # carries this run's prefix: the toolchain and package graph that
      # restore-keys would accept from GitHub's cache.
      - name: Use the runner's Swift build cache
        id: runner-swift-cache
        if: steps.swift-cache.outputs.enabled == 'true'
        env:
          CACHE_PREFIX: ${{ steps.swift-cache.outputs.prefix }}
          RUNNER_CACHE_ROOT: /home/runner/swift-build-cache
        run: |
          set -euo pipefail
          cache="$RUNNER_CACHE_ROOT/$GITHUB_REPOSITORY"
          key="$(cat "$cache/.touchstone-swift-cache-key" 2>/dev/null || true)"
          case "$key" in
            "$CACHE_PREFIX"?*) ;;
            *)
              echo "This runner holds no build cache for this toolchain and package graph."
              exit 0
              ;;
          esac
          [ -d "$cache/.build" ] && [ ! -e .build ] || exit 0
          cp -a "$cache/.build" .build
          echo "Build cache from this runner's image: $key"
          echo 'hit=true' >>"$GITHUB_OUTPUT"

      - name: Restore Swift build cache
        id: restore-swift-cache
        if: steps.swift-cache.outputs.enabled == 'true' && steps.runner-swift-cache.outputs.hit != 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .build
          key: ${{ steps.swift-cache.outputs.key }}
          restore-keys: ${{ steps.swift-cache.outputs.prefix }}

      - name: Fetch pinned Touchstone validator
        run: |
          set -euo pipefail
          touchstone_revision="d2031284cff02a088a04987e0327f71e058c79ba"
          touchstone_sha256="9de43e0c028ad6e4771b47338cbd88b0aab3d17600ab401ca17f17dfd4f9d5ef"
          validator="$RUNNER_TEMP/touchstone-run.sh"
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/autumngarage/touchstone/${touchstone_revision}/scripts/touchstone-run.sh" \
            --output "$validator"
          printf '%s  %s\n' "$touchstone_sha256" "$validator" | sha256sum --check --strict

      - name: Run declared validation
        env:
          # Empty for the serial run (cache seeds, engines without a groups
          # inventory); otherwise this shard's declared group name.
          VALIDATION_GROUP: ${{ matrix.group }}
        run: |
          set -euo pipefail
          group_args=()
          if [ -n "$VALIDATION_GROUP" ]; then
            group_args=(--group "$VALIDATION_GROUP")
          fi
          bash "$RUNNER_TEMP/touchstone-run.sh" validate \
            --project "$GITHUB_WORKSPACE" \
            "${group_args[@]}" \
            --json

      - name: Verify cached toolchain stayed in force
        if: steps.swift-cache.outputs.enabled == 'true'
        env:
          EXPECTED_TOOLCHAIN: ${{ steps.swift-cache.outputs.toolchain }}
        run: |
          set -euo pipefail
          actual="$(swift --version | sha256sum | cut -d ' ' -f 1)"
          if [ "$actual" != "$EXPECTED_TOOLCHAIN" ]; then
            echo "SWIFT_BUILD_CACHE requires validation setup to retain the preinstalled Swift toolchain." >&2
            exit 1
          fi

      # Tells runner/linux-runner.sh which cache this seed's .build is. Outside
      # .build, so GitHub's copy never carries it into other runs.
      - name: Record the Swift build cache key
        if: success() && matrix.group == '' && steps.swift-cache.outputs.save == 'true'
        env:
          CACHE_KEY: ${{ steps.swift-cache.outputs.key }}
          CACHE_KEY_FILE: /home/runner/.touchstone-swift-cache-key
        run: |
          set -euo pipefail
          [ -d .build ] || exit 0
          if [ -w "$(dirname "$CACHE_KEY_FILE")" ]; then
            printf '%s\n' "$CACHE_KEY" >"$CACHE_KEY_FILE"
          fi

      - name: Save default-branch Swift build cache
        if: success() && matrix.group == '' && steps.swift-cache.outputs.save == 'true' && steps.restore-swift-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .build
          key: ${{ steps.swift-cache.outputs.key }}

  validate:
    # The required check. Reports success only when the plan and every
    # shard succeeded; a failed plan, a failed or skipped shard matrix,
    # and a cancelled run all land as failure here, never as a silent
    # pass. Runs even when a shard failed, so the required context always
    # reports a terminal verdict for the head.
    if: ${{ always() && github.repository != 'autumngarage/touchstone-workflows' }}
    needs: [plan, validate-groups]
    name: validate (ubuntu-latest)
    # Reporting completed shard verdicts must not queue behind new builds.
    runs-on: ${{ vars.LINUX_GATE_RUNNER && fromJSON(format('["self-hosted","{0}"]', vars.LINUX_GATE_RUNNER)) || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - name: Require every validation group
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          GROUPS_RESULT: ${{ needs.validate-groups.result }}
        run: |
          set -euo pipefail
          if [ "$PLAN_RESULT" != success ]; then
            echo "Validation planning did not succeed: $PLAN_RESULT" >&2
            exit 1
          fi
          if [ "$GROUPS_RESULT" != success ]; then
            echo "Declared validation did not succeed in every group: $GROUPS_RESULT" >&2
            exit 1
          fi
          echo "Declared validation succeeded in every group."
