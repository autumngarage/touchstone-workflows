name: validate

# Central required validation for Touchstone. GitHub executes this immutable
# source against the target pull request, outside that PR's control.
#
# DEPENDENCY CONTRACT: this job may depend on the runner image, the target
# repository, and github.com. Nothing else. Anything no test executes is not
# installed here.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [main]
  # The merge queue tests the merged result on a temporary commit; the
  # required check must report there or every queue entry is ejected.
  merge_group:
    types: [checks_requested]

# One validation per pull request at a time. A newer push supersedes the older
# head's run, which would otherwise finish and bill for a verdict nobody reads
# (AUT-1591). A merge-queue run is never cancelled: the queue owns that
# verdict, and each queue entry has its own ref, so no two share a group.
concurrency:
  group: validate-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  source-contract:
    # Required workflows do not run against their source repository. This job
    # keeps changes to the adapter reviewable without adding work to consumers.
    if: github.repository == 'autumngarage/touchstone-workflows'
    name: source contract
    # Runs this repository's candidate tests, so it never takes the
    # LINUX_RUNNER setting; see "Runner" in README.md.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout workflow source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Fetch declared validation engine
        run: |
          set -euo pipefail
          engine_revision="$(jq -er '.validationEngine.revision' .touchstone-source-contract.json)"
          engine_sha256="$(jq -er '.validationEngine.sha256' .touchstone-source-contract.json)"
          engine_path="$(jq -er '.validationEngine.path' .touchstone-source-contract.json)"
          validator="$RUNNER_TEMP/touchstone-run.sh"
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/autumngarage/touchstone/${engine_revision}/${engine_path}" \
            --output "$validator"
          printf '%s  %s\n' "$engine_sha256" "$validator" | sha256sum --check --strict
          printf 'TOUCHSTONE_ENGINE_PATH=%s\n' "$validator" >>"$GITHUB_ENV"

      - name: Test workflow contract
        run: bash tests/test-workflow.sh

  validate:
    # GitHub excludes required workflows from their source repository. Mirror
    # that boundary for this file's ordinary pull_request/push triggers.
    if: github.repository != 'autumngarage/touchstone-workflows'
    name: validate (ubuntu-latest)
    # Executes the candidate's own declared commands, so it may leave
    # GitHub-hosted runners only for single-use ones: LINUX_RUNNER names the
    # runners runner/linux-runner.sh registers for exactly one job in a
    # throwaway container, and nothing else (AUT-1596). See "Runner" in
    # README.md.
    runs-on: ${{ vars.LINUX_RUNNER && fromJSON(format('["self-hosted","{0}"]', vars.LINUX_RUNNER)) || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - name: Checkout target repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config --global user.email "ci@touchstone.invalid"
          git config --global user.name "Touchstone CI"
          git config --global init.defaultBranch main

      - name: Fetch pinned Touchstone validator
        run: |
          set -euo pipefail
          touchstone_revision="ef2934d6baff508464d565d557f7ddf487e012e2"
          touchstone_sha256="51daa8d4e543260c258613e7f14faa77c7d54eb310c22fb83c505e2c33376e1e"
          validator="$RUNNER_TEMP/touchstone-run.sh"
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/autumngarage/touchstone/${touchstone_revision}/scripts/touchstone-run.sh" \
            --output "$validator"
          printf '%s  %s\n' "$touchstone_sha256" "$validator" | sha256sum --check --strict

      # AUT-1592: a GitHub-hosted macOS minute consumes about ten included
      # Actions minutes, and a Windows minute about two, so no consumer
      # workflow may name such a runner, or take its runner from a setting
      # without also requiring the self-hosted label. The program reads the
      # candidate's own workflows; tests/test-hosted-runners.sh runs it
      # against fixtures. Ruby ships on ubuntu-latest and in runner/Dockerfile.
      - name: Refuse GitHub-hosted macOS and Windows runners
        run: |
          set -euo pipefail
          ruby -rpsych - "$GITHUB_WORKSPACE" <<'RUBY'
          # Refuses two shapes in every top-level .github/workflows/*.yml and
          # *.yaml file of PROJECT_DIR:
          #   1. A GitHub-hosted macOS or Windows image named on any
          #      non-comment line, in any case (macos-<n>, macos-latest,
          #      windows-<n>, windows-latest, and the larger-runner spellings
          #      built from them). Read as text on purpose, so a matrix entry
          #      or an expression's fallback is caught wherever it is written.
          #   2. A job whose runs-on can take its label from a setting
          #      (vars.NAME or vars['NAME']) without also requiring the
          #      self-hosted label. Read from the parsed workflow, so every
          #      form GitHub accepts is the same to it. A list with a
          #      self-hosted item passes as a whole; otherwise every setting
          #      reference is judged on its own: it is safe only as the value
          #      of format('[..."self-hosted"...]', vars.NAME), or as a
          #      condition (compared, negated, followed by &&, or passed to
          #      contains, startsWith, or endsWith).
          # Exit 0 when clean, 1 on any finding (a workflow that does not
          # parse is one), 2 on a usage or read error.
          if ARGV.length != 1
            warn "Usage: ruby -rpsych <this program> PROJECT_DIR"
            exit 2
          end
          project = ARGV.fetch(0)
          unless File.directory?(project)
            warn "ERROR: project directory #{project} does not exist"
            exit 2
          end
          dir = File.join(project, ".github", "workflows")

          # GitHub reads workflows only from the top level of .github/workflows.
          unless File.exist?(dir)
            puts "hosted-runner check: no workflow files in #{dir}; nothing to check."
            exit 0
          end
          begin
            names = Dir.children(dir)
          rescue SystemCallError => e
            warn "ERROR: cannot read #{dir}: #{e.message}"
            exit 2
          end
          files = names.select { |n| n.end_with?(".yml", ".yaml") }
                       .map { |n| File.join(dir, n) }
                       .select { |p| File.file?(p) }
                       .sort
          if files.empty?
            puts "hosted-runner check: no workflow files in #{dir}; nothing to check."
            exit 0
          end

          HOSTED = /(?:\A|[^a-z0-9_.-])((?:macos|windows)-(?:latest|[0-9])[a-z0-9._-]*)/i
          SETTING_REF = /\bvars\s*(?:\.\s*[A-Za-z_][A-Za-z0-9_-]*|\[\s*'[^']*'\s*\])/

          # Can a setting reference in TEXT become a runner label? Each
          # reference is judged on its own: one wrapped branch never excuses
          # a bare one beside it.
          def exposes_setting?(text)
            text.to_enum(:scan, SETTING_REF).any? do
              match = Regexp.last_match
              before = text[0...match.begin(0)]
              after = text[match.end(0)..-1]
              wrapped = before =~ /format\(\s*'[^']*self-hosted[^']*'\s*,\s*\z/i
              condition = after =~ /\A\s*(?:==|!=|<=|>=|<|>|&&)/ ||
                          before =~ /(?:==|!=|<=|>=|<|>)\s*\z/ ||
                          before =~ /!\s*\z/ ||
                          before =~ /\b(?:contains|startsWith|endsWith)\(\s*(?:'[^']*'\s*,\s*)?\z/i
              !(wrapped || condition)
            end
          end

          # A runs-on list, or a mapping's labels list, with a self-hosted item
          # requires every label together, so no setting in it can select a
          # hosted runner.
          def lists_self_hosted?(node, anchors)
            node = resolve(node, anchors)
            if node.is_a?(Psych::Nodes::Mapping)
              labels = entry(node, "labels")
              return labels ? lists_self_hosted?(labels[1], anchors) : false
            end
            return false unless node.is_a?(Psych::Nodes::Sequence)
            node.children.any? do |child|
              child = resolve(child, anchors)
              child.is_a?(Psych::Nodes::Scalar) && child.value.strip.casecmp?("self-hosted")
            end
          end

          # The key and value nodes for KEY in a mapping node, or nil.
          def entry(mapping, key)
            mapping.children.each_slice(2) do |k, v|
              return [k, v] if k.is_a?(Psych::Nodes::Scalar) && k.value == key
            end
            nil
          end

          def resolve(node, anchors)
            node.is_a?(Psych::Nodes::Alias) ? anchors[node.anchor] : node
          end

          # Every scalar under NODE, following aliases once each.
          def scalars(node, anchors, seen = {})
            case node
            when Psych::Nodes::Scalar then [node.value]
            when Psych::Nodes::Alias
              return [] if seen[node.anchor]
              scalars(anchors[node.anchor], anchors, seen.merge(node.anchor => true))
            when Psych::Nodes::Sequence, Psych::Nodes::Mapping
              node.children.flat_map { |child| scalars(child, anchors, seen) }
            else
              []
            end
          end

          findings = []
          files.each do |path|
            begin
              text = File.read(path)
            rescue SystemCallError => e
              warn "ERROR: cannot read #{path}: #{e.message}"
              exit 2
            end

            text.each_line.with_index(1) do |line, number|
              next if line =~ /\A\s*#/
              match = line.sub(/\s#.*/m, "").match(HOSTED)
              next unless match
              findings << "#{path}:#{number}: names the GitHub-hosted image '#{match[1].downcase}'; macOS and Windows work runs only on a self-hosted runner that a setting names"
            end

            begin
              document = Psych.parse(text)
            rescue Psych::SyntaxError => e
              findings << "#{path}:#{e.line}: does not parse as YAML (#{e.problem}); GitHub would not run it either"
              next
            end
            next unless document.is_a?(Psych::Nodes::Document)
            anchors = {}
            document.each do |node|
              next if node.is_a?(Psych::Nodes::Alias)
              anchors[node.anchor] = node if node.respond_to?(:anchor) && node.anchor
            end
            root = resolve(document.root, anchors)
            next unless root.is_a?(Psych::Nodes::Mapping)
            jobs = entry(root, "jobs")
            jobs = jobs && resolve(jobs[1], anchors)
            next unless jobs.is_a?(Psych::Nodes::Mapping)
            jobs.children.each_slice(2) do |_name, job|
              job = resolve(job, anchors)
              next unless job.is_a?(Psych::Nodes::Mapping)
              runs_on = entry(job, "runs-on")
              next unless runs_on
              next if lists_self_hosted?(runs_on[1], anchors)
              next unless scalars(runs_on[1], anchors).any? { |label| exposes_setting?(label) }
              findings << "#{path}:#{runs_on[0].start_line + 1}: runs-on can take its label from a setting (vars) that is not wrapped with the self-hosted label, so the setting could name a GitHub-hosted image; wrap every such reference as fromJSON(format('[\"self-hosted\",\"{0}\"]', vars.NAME))"
            end
          end

          if findings.empty?
            puts "hosted-runner check: #{files.length} workflow file(s), no GitHub-hosted macOS or Windows runner."
            exit 0
          end
          findings.each { |finding| warn finding }
          warn "hosted-runner check: refused. Route macOS and Windows work to a self-hosted runner that a setting names, with the self-hosted label required, or remove it."
          exit 1
          RUBY

      - name: Run declared validation
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/touchstone-run.sh" validate \
            --project "$GITHUB_WORKSPACE" \
            --json
