name: validate

# Central required validation for Touchstone. GitHub executes this immutable
# source against the target pull request, outside that PR's control.
#
# DEPENDENCY CONTRACT: this job may depend on the runner image, the target
# repository, and github.com. Nothing else. Anything no test executes is not
# installed here.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: touchstone-validate-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: validate (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout target repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config --global user.email "ci@touchstone.invalid"
          git config --global user.name "Touchstone CI"
          git config --global init.defaultBranch main

      - name: Run the test suite
        run: |
          set -uo pipefail
          failed=0
          for test in tests/test-*.sh; do
            echo "::group::$test"
            if bash "$test"; then
              echo "PASS $test"
            else
              echo "::error file=$test::test file failed"
              failed=$((failed + 1))
            fi
            echo "::endgroup::"
          done
          if [ "$failed" -ne 0 ]; then
            echo "$failed test file(s) failed"
            exit 1
          fi
          echo "suite green"
