name: validate

# Central required validation for Touchstone. GitHub executes this immutable
# source against the target pull request, outside that PR's control.
#
# DEPENDENCY CONTRACT: this job may depend on the runner image, the target
# repository, and github.com. Nothing else. Anything no test executes is not
# installed here.

on:
  # Consumers may invoke this same validator on their default branch to
  # produce a cache that later PR and merge-queue runs can restore.
  workflow_call:
    inputs:
      # For the cache seed alone. A seed that starts with no cache to restore
      # (a new runner architecture, a changed package graph) builds everything
      # from nothing, and on a hosted runner that takes longer than a pull
      # request's limit; the limit then cancels the only run that could have
      # saved the cache, and every later run starts just as cold (AUT-2174).
      # Pull requests, pushes, and the merge queue never pass an input, so
      # they keep the default.
      timeout_minutes:
        description: Job time limit in minutes. Raise it only for a cache seed that may build cold.
        type: number
        default: 30
      blacksmith:
        description: Run an explicit Linux trial on Blacksmith instead of the default runner.
        type: boolean
        default: false
      # Names the runner outright for a caller that needs a particular one:
      # a cache seed for the local fleet's architecture runs there, because
      # only a run on that architecture can save a cache it restores.
      runner:
        description: Run on this runner instead of the routed one (local, blacksmith or github).
        type: string
        default: ''
      separate_scheduled_validation:
        description: Give an opted-in caller's scheduled validation a separate concurrency group from its seeds.
        type: boolean
        default: false
      force_full_checkout:
        description: Keep a complete checkout even when the repository opts into blobless history.
        type: boolean
        default: false
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [main]
  # The merge queue tests the merged result on a temporary commit; the
  # required check must report there or every queue entry is ejected.
  merge_group:
    types: [checks_requested]

# One validation per pull request at a time. A newer push supersedes the older
# head's run, which would otherwise finish and bill for a verdict nobody reads
# (AUT-1591). A merge-queue run is never cancelled: the queue owns that
# verdict, and each queue entry has its own ref, so no two share a group.
# The called workflow sees the caller's ref. A caller that separates its
# scheduled validation must opt in here too, or both roles share this key.
concurrency:
  group: validate-${{ github.repository }}-${{ inputs.separate_scheduled_validation && github.event_name == 'schedule' && 'schedule-' || '' }}${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  source-contract:
    # Required workflows do not run against their source repository. This job
    # keeps changes to the adapter reviewable without adding work to consumers.
    if: github.repository == 'autumngarage/touchstone-workflows'
    name: source contract
    # The supervisor fixtures require atomic mkdir. Ubuntu 26.04's uutils
    # can report two owners of one directory (Ubuntu bug 2171333).
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout workflow source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Fetch declared validation engine
        run: |
          set -euo pipefail
          engine_revision="$(jq -er '.validationEngine.revision' .touchstone-source-contract.json)"
          engine_sha256="$(jq -er '.validationEngine.sha256' .touchstone-source-contract.json)"
          engine_path="$(jq -er '.validationEngine.path' .touchstone-source-contract.json)"
          validator="$RUNNER_TEMP/touchstone-run.sh"
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/autumngarage/touchstone/${engine_revision}/${engine_path}" \
            --output "$validator"
          printf '%s  %s\n' "$engine_sha256" "$validator" | sha256sum --check --strict
          printf 'TOUCHSTONE_ENGINE_PATH=%s\n' "$validator" >>"$GITHUB_ENV"

      - name: Test workflow contract
        run: bash tests/test-workflow.sh

  plan:
    # Reads the candidate's declaration through the pinned engine to learn
    # its execution groups. Executes no candidate code. GitHub excludes
    # required workflows from their source repository; mirror that here.
    if: github.repository != 'autumngarage/touchstone-workflows'
    name: validate plan
    # Trusted declaration parsing, on GitHub-hosted Linux.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
      statuses: read
    timeout-minutes: 5
    outputs:
      group_targets: ${{ steps.plan.outputs.group_targets }}
      github_overflow_group: ${{ steps.overflow.outputs.group }}
      github_arm_group: ${{ steps.arm.outputs.group }}
      local_merge_group: ${{ steps.local-merge.outputs.group }}
      local_merge_labels: ${{ steps.local-merge.outputs.labels }}
      local_merge_attempt: ${{ steps.local-merge.outputs.attempt }}
      matrix: ${{ steps.plan.outputs.matrix }}
      max_parallel: ${{ steps.plan.outputs.max_parallel }}
      validation_event: ${{ steps.plan.outputs.validation_event }}
    steps:
      - name: Checkout target repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Fetch pinned Touchstone validator
        run: |
          set -euo pipefail
          touchstone_revision="ca988d8db3bac765031c7190d4687a6d5e302890"
          touchstone_sha256="dd1f44b4117d4ccb5634bec4ee6c24b6e3cef5d8eaea8b940edb74b118dbf7f4"
          validator="$RUNNER_TEMP/touchstone-run.sh"
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/autumngarage/touchstone/${touchstone_revision}/scripts/touchstone-run.sh" \
            --output "$validator"
          printf '%s  %s\n' "$touchstone_sha256" "$validator" | sha256sum --check --strict

      - name: Plan validation groups
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          VALIDATION_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          VALIDATION_MAX_PARALLEL: ${{ vars.VALIDATION_MAX_PARALLEL }}
          LINUX_VALIDATION_RUNNER: ${{ vars.LINUX_VALIDATION_RUNNER }}
          LINUX_PR_RUNNER: ${{ vars.LINUX_PR_RUNNER }}
          LINUX_QUEUE_RUNNER: ${{ vars.LINUX_QUEUE_RUNNER }}
          INPUT_RUNNER: ${{ inputs.runner }}
          LEGACY_TARGET: ${{ inputs.blacksmith && 'blacksmith' || inputs.runner || (github.event_name == 'merge_group' && vars.LINUX_QUEUE_RUNNER) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.LINUX_PR_RUNNER) || vars.LINUX_VALIDATION_RUNNER || (vars.BLACKSMITH_LINUX == 'true' && 'blacksmith') || 'github' }}
          LINUX_LOCAL_PR_GROUPS: ${{ vars.LINUX_LOCAL_PR_GROUPS }}
          LINUX_LOCAL_X64_GROUPS: ${{ vars.LINUX_LOCAL_X64_GROUPS }}
          PRIVATE_PR: ${{ github.event_name == 'pull_request' && github.event.repository.private && github.event.pull_request.head.repo.full_name == github.repository }}
          SAME_REPOSITORY_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
          LOCAL_SEED: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.event.repository.private && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && inputs.runner == 'local' && !inputs.blacksmith }}
        run: |
          set -euo pipefail
          # A misspelt runner would fall through to another one unnoticed.
          case "${LINUX_VALIDATION_RUNNER:-}" in
            ''|blacksmith|github) ;;
            *)
              echo "LINUX_VALIDATION_RUNNER must be blacksmith, github, or unset; it is '${LINUX_VALIDATION_RUNNER:-}'" >&2
              exit 1
              ;;
          esac
          for switch in LINUX_PR_RUNNER LINUX_QUEUE_RUNNER INPUT_RUNNER; do
            case "${!switch:-}" in
              ''|local|blacksmith|github) ;;
              *)
                echo "$switch must be local, blacksmith, github, or unset; it is '${!switch:-}'" >&2
                exit 1
                ;;
            esac
          done
          contract="$(bash "$RUNNER_TEMP/touchstone-run.sh" validate \
            --project "$GITHUB_WORKSPACE" \
            --check-contract \
            --json)"
          unchanged_declaration() {
            local base="${VALIDATION_BASE_SHA:-}" candidate="${GITHUB_SHA:-}" base_entry candidate_entry entry worktree_oid
            [[ "$base" =~ ^[0-9a-f]{40}$ && "$candidate" =~ ^[0-9a-f]{40}$ ]] || return 1
            [ "$(git --no-replace-objects -C "$GITHUB_WORKSPACE" rev-parse HEAD 2>/dev/null)" = "$candidate" ] || return 1
            for entry in "$base" "$candidate"; do
              [ "$(git --no-replace-objects -C "$GITHUB_WORKSPACE" cat-file -t "$entry" 2>/dev/null)" = commit ] || return 1
            done
            base_entry="$(git --no-replace-objects -C "$GITHUB_WORKSPACE" ls-tree "$base" -- .touchstone.toml 2>/dev/null)" || return 1
            candidate_entry="$(git --no-replace-objects -C "$GITHUB_WORKSPACE" ls-tree "$candidate" -- .touchstone.toml 2>/dev/null)" || return 1
            for entry in "$base_entry" "$candidate_entry"; do
              case "$entry" in '100644 blob '*|'100755 blob '*) ;; *) return 1 ;; esac
            done
            [ "$base_entry" = "$candidate_entry" ] || return 1
            [ -f "$GITHUB_WORKSPACE/.touchstone.toml" ] && [ ! -L "$GITHUB_WORKSPACE/.touchstone.toml" ] || return 1
            worktree_oid="$(git --no-replace-objects -C "$GITHUB_WORKSPACE" hash-object --no-filters -- .touchstone.toml 2>/dev/null)" || return 1
            [ "$worktree_oid" = "$(awk '{print $3}' <<<"$candidate_entry")" ]
          }
          planned_groups="$(jq -c '.groups // []' <<<"$contract")"
          validation_event=''
          # A pull request and a merge-queue candidate plan only the groups
          # their event keeps, when the engine names them and the declaration
          # is the base's own; anything else keeps full validation.
          case "$EVENT_NAME" in
            pull_request | merge_group)
              if jq -e --arg key "${EVENT_NAME}_groups" '(.[$key] | type == "array" and length > 0)' <<<"$contract" >/dev/null; then
                if unchanged_declaration; then
                  planned_groups="$(jq -c --arg key "${EVENT_NAME}_groups" '.[$key]' <<<"$contract")"
                  validation_event="$EVENT_NAME"
                else
                  echo "$EVENT_NAME declaration provenance changed or unavailable; retaining full validation." >&2
                fi
              fi
              ;;
          esac
          # Cache seeds stay one serial run: the saved build products must
          # come from a single complete validation. An engine whose
          # contract carries no groups inventory also runs serially, so
          # this workflow keeps working against older pinned engines.
          # Reusable workflows keep the caller's event, including manual seeds.
          if [ "$EVENT_NAME" = workflow_call ] || [ "$EVENT_NAME" = push ] || [ "$EVENT_NAME" = workflow_dispatch ]; then
            matrix='{"include":[{"name":"all","group":""}]}'
          else
            matrix="$(printf '%s' "$planned_groups" | jq -c '
              if length == 0
              then {"include":[{"name":"all","group":""}]}
              else {"include":[.[] | {"name":.name,"group":.name}]}
              end')"
          fi
          requested_parallelism="${VALIDATION_MAX_PARALLEL:-2}"
          if ! [[ "$requested_parallelism" =~ ^[1-9][0-9]*$ ]]; then
            echo 'VALIDATION_MAX_PARALLEL must be a positive integer' >&2
            exit 1
          fi
          group_count="$(printf '%s' "$matrix" | jq '.include | length')"
          # Compare lengths first so even an oversized decimal cannot overflow
          # shell arithmetic. The declared matrix is the actual upper bound.
          if [ "${#requested_parallelism}" -gt "${#group_count}" ] || [ "$requested_parallelism" -gt "$group_count" ]; then
            requested_parallelism="$group_count"
          fi
          # Keep placement out of the matrix: GitHub includes every matrix value in its check name.
          if [ -z "${LINUX_LOCAL_PR_GROUPS:-}" ]; then
            legacy_target="${LEGACY_TARGET:-github}"
            # A fork must not inherit the base repository's global runner setting.
            if [ "$EVENT_NAME" = pull_request ] && [ "${SAME_REPOSITORY_PR:-}" != true ]; then
              legacy_target=github
            fi
            targets="$(jq -c --arg target "$legacy_target" '
              .include | unique_by(.name | ascii_downcase) | map({key:.name, value:$target}) | from_entries
            ' <<<"$matrix")"
          else
            targets="$(jq -ce --argjson local_groups "$LINUX_LOCAL_PR_GROUPS" \
              --arg private_pr "$PRIVATE_PR" --arg local_seed "$LOCAL_SEED" '
              if ($local_groups | type != "array" or any(.[]; type != "string" or (test("^[A-Za-z0-9._-]+\\z") | not)))
              then error("LINUX_LOCAL_PR_GROUPS must be a JSON array of named groups") else . end
              | .include | group_by(.name | ascii_downcase) | map(
                  # Actions object keys ignore case. A differently cased sibling must not inherit a local slot.
                  {key: .[0].name, value: (
                    if $local_seed == "true" and .[0].group == "" then "local"
                    elif $private_pr == "true" and all(.[]; .group as $g | $local_groups | index($g) != null) then "local"
                    else "github" end)})
              | from_entries' <<<"$matrix")"
          fi
          # A group whose work needs an x86-64 engine (an amd64-only image)
          # runs only on the fleet's x86-64 runners, which carry linux-x64.
          if [ -n "${LINUX_LOCAL_X64_GROUPS:-}" ]; then
            targets="$(jq -ce --argjson x64 "$LINUX_LOCAL_X64_GROUPS" '
              if ($x64 | type != "array" or any(.[]; type != "string" or (test("^[A-Za-z0-9._-]+\\z") | not)))
              then error("LINUX_LOCAL_X64_GROUPS must be a JSON array of named groups") else . end
              | with_entries(if .value == "local" and (.key as $k | $x64 | index($k)) != null then .value = "local-x64" else . end)
            ' <<<"$targets")"
          fi
          {
            printf 'group_targets=%s\n' "$targets"
            printf 'matrix=%s\n' "$matrix"
            printf 'max_parallel=%s\n' "$requested_parallelism"
            printf 'validation_event=%s\n' "$validation_event"
          } >>"$GITHUB_OUTPUT"

      - name: Verify GitHub overflow grant
        id: overflow
        if: github.run_attempt == 1 && github.event_name == 'pull_request' && github.event.repository.private && github.event.pull_request.head.repo.full_name == github.repository && vars.LINUX_LOCAL_PR_GROUPS != '' && vars.LINUX_GITHUB_OVERFLOW != ''
        env:
          GRANT: ${{ vars.LINUX_GITHUB_OVERFLOW }}
          MATRIX: ${{ steps.plan.outputs.matrix }}
          TARGETS: ${{ steps.plan.outputs.group_targets }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Multiple matrix names can share a case-insensitive Actions key.
          # Exactly one already-local job must match before spending an API read.
          if ! group="$(jq -ner --argjson grant "$GRANT" --argjson planned_matrix "$MATRIX" --argjson planned_targets "$TARGETS" \
            --arg repo "$GITHUB_REPOSITORY_ID" --arg number "$GITHUB_RUN_NUMBER" '
            $grant | select(
              keys == ["event","expires_at","group","repository_id","run_number","v","workflow_id"]
              and .v == 1 and .event == "pull_request" and .repository_id == $repo
              and (.run_number | type == "number" and tostring == $number)
              and (.workflow_id | type == "number" and floor == . and . > 0)
              and (.expires_at | type == "number" and floor == . and . > now and . <= now + 600)
            ) | .group as $g | select($planned_targets[$g] == "local"
              and ([$planned_matrix.include[] | select((.name | ascii_downcase) == ($g | ascii_downcase)) | .group] == [$g])
            ) | $g' 2>/dev/null)"; then
            echo "No matching GitHub overflow grant. Keeping planned placement."
            exit 0
          fi
          if ! run="$(curl --fail --silent --show-error --max-time 10 \
            --header "Authorization: Bearer $GH_TOKEN" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")"; then
            echo "Could not read current run metadata. Keeping planned placement."
            exit 0
          fi
          if jq -e --argjson grant "$GRANT" --arg id "$GITHUB_RUN_ID" '
            (.id | tostring) == $id and (.repository.id | tostring) == $grant.repository_id
            and .workflow_id == $grant.workflow_id and .run_number == $grant.run_number
            and .event == $grant.event and .path == ".github/workflows/validate.yml"
            and .run_attempt == 1 and $grant.expires_at > now
          ' <<<"$run" >/dev/null; then
            printf 'group=%s\n' "$group" >>"$GITHUB_OUTPUT"
            echo "Selected GitHub-hosted Ubuntu for $group."
          else
            echo "Current run does not match its overflow grant. Keeping planned placement."
          fi

      - name: Select standard GitHub Arm for a qualified integration group
        id: arm
        if: github.event_name == 'merge_group' && github.event.repository.private && github.event.merge_group.base_ref == format('refs/heads/{0}', github.event.repository.default_branch) && vars.LINUX_QUEUE_ARM_GROUP != ''
        env:
          CONFIG: ${{ vars.LINUX_QUEUE_ARM_GROUP }}
          MATRIX: ${{ steps.plan.outputs.matrix }}
          TARGETS: ${{ steps.plan.outputs.group_targets }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Actions compares strings without case. Only one exactly named, already-hosted group qualifies.
          if ! group="$(jq -ner --argjson config "$CONFIG" --argjson planned_matrix "$MATRIX" --argjson planned_targets "$TARGETS" '
            $config | select(keys == ["group","workflow_id"] and (.workflow_id | type == "number" and . > 0 and floor == .))
            | .group | select(type == "string" and test("^[A-Za-z0-9._-]+\\z")) as $g
            | select($planned_targets[$g] == "github" and ([$planned_matrix.include[] | select((.name | ascii_downcase) == ($g | ascii_downcase)) | .group] == [$g]))
            | $g' 2>/dev/null)"; then
            echo "No qualified GitHub Arm group. Keeping planned placement."
            exit 0
          fi
          if ! run="$(curl --fail --silent --show-error --max-time 10 --header "Authorization: Bearer $GH_TOKEN" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")"; then
            echo "Could not read integration run metadata. Keeping planned placement."
            exit 0
          fi
          # A reusable caller inherits its triggering event. Require the repository's own required run.
          if jq -e --argjson config "$CONFIG" --arg id "$GITHUB_RUN_ID" --arg repo "$GITHUB_REPOSITORY_ID" --arg sha "$GITHUB_SHA" '
            (.id | tostring) == $id and (.repository.id | tostring) == $repo
            and .workflow_id == $config.workflow_id and .path == ".github/workflows/validate.yml"
            and .event == "merge_group" and .head_sha == $sha and .referenced_workflows == []
          ' <<<"$run" >/dev/null; then
            printf 'group=%s\n' "$group" >>"$GITHUB_OUTPUT"
            echo "Selected standard GitHub Arm for $group."
          else
            echo "Current workflow does not match the qualified integration. Keeping planned placement."
          fi

      - name: Admit a qualified isolated local merge group
        id: local-merge
        if: github.event_name == 'merge_group' && github.event.repository.private && github.event.merge_group.base_ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          MATRIX: ${{ steps.plan.outputs.matrix }}
          TARGETS: ${{ steps.plan.outputs.group_targets }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The planner executes only this reviewed helper, never target code.
          routing_revision="112aeef0c819a470f9a6a1957a8d4c898892346e"
          routing_sha256="d2009562afa5704dae15c719a19368f1e6d39bfdd45c4c98f3e3061fa25ec4cf"
          helper="$RUNNER_TEMP/merge-routing.py"
          if ! curl --fail --silent --show-error --max-time 10 --location \
            "https://raw.githubusercontent.com/autumngarage/touchstone-workflows/${routing_revision}/runner/merge-routing.py" \
            --output "$helper"; then
            echo 'Local merge admission helper unavailable. Keeping planned placement.' >&2
            exit 0
          fi
          printf '%s  %s\n' "$routing_sha256" "$helper" | sha256sum --check --strict
          python3 "$helper" plan
          printf 'attempt=%s\n' "$GITHUB_RUN_ATTEMPT" >>"$GITHUB_OUTPUT"

  validate-groups:
    # GitHub excludes required workflows from their source repository. Mirror
    # that boundary for this file's ordinary pull_request/push triggers.
    if: github.repository != 'autumngarage/touchstone-workflows'
    needs: plan
    # No display name: a templated one would breach the source contract's
    # literal job-name guard, and GitHub already appends each shard's
    # matrix values (its group name) to the job ID in the check list.
    # Only the protected planner can select one of these targets for a candidate group.
    # A failed-job rerun can reuse the first attempt's plan outputs.
    runs-on: ${{ needs.plan.outputs.local_merge_attempt == github.run_attempt && needs.plan.outputs.local_merge_group && needs.plan.outputs.local_merge_group == matrix.name && fromJSON(needs.plan.outputs.local_merge_labels) || github.run_attempt == 1 && needs.plan.outputs.github_overflow_group && needs.plan.outputs.github_overflow_group == matrix.name && 'ubuntu-latest' || needs.plan.outputs.github_arm_group && needs.plan.outputs.github_arm_group == matrix.name && 'ubuntu-24.04-arm' || fromJSON('{"local":["self-hosted","linux-ephemeral"],"local-x64":["self-hosted","linux-ephemeral","linux-x64"],"blacksmith":"blacksmith-4vcpu-ubuntu-2404","github":"ubuntu-latest"}')[fromJSON(needs.plan.outputs.group_targets)[matrix.name]] }}
    # Cloud Swift builds can spend 20 minutes compiling before tests. Allow a
    # bounded cold run; non-Swift jobs retain 30 minutes.
    timeout-minutes: ${{ inputs.timeout_minutes || (vars.SWIFT_BUILD_CACHE == 'true' && 60 || 30) }}
    strategy:
      # Once a queue candidate fails, its other shards cannot make it valid.
      # Release those slots; the always-running aggregate still fails closed.
      # Author/maintenance runs retain every shard's diagnostic evidence.
      # Default two leaves slots for other candidates. An administrator can
      # opt into another budget; the planner caps it to the actual groups.
      fail-fast: ${{ github.event_name == 'merge_group' }}
      max-parallel: ${{ fromJSON(needs.plan.outputs.max_parallel) }}
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout target repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          filter: ${{ inputs.force_full_checkout != true && vars.VALIDATION_BLOBLESS_CHECKOUT == 'true' && 'blob:none' || '' }}

      - name: Configure git identity
        run: |
          git config --global user.email "ci@touchstone.invalid"
          git config --global user.name "Touchstone CI"
          git config --global init.defaultBranch main

      - name: Fetch pinned Touchstone validator
        run: |
          set -euo pipefail
          touchstone_revision="ca988d8db3bac765031c7190d4687a6d5e302890"
          touchstone_sha256="dd1f44b4117d4ccb5634bec4ee6c24b6e3cef5d8eaea8b940edb74b118dbf7f4"
          validator="$RUNNER_TEMP/touchstone-run.sh"
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/autumngarage/touchstone/${touchstone_revision}/scripts/touchstone-run.sh" \
            --output "$validator"
          printf '%s  %s\n' "$touchstone_sha256" "$validator" | sha256sum --check --strict

      - name: Prepare declared validation setup
        if: vars.SWIFT_BUILD_CACHE == 'true' && runner.os == 'Linux' && hashFiles('Package.resolved') != ''
        env:
          VALIDATION_GROUP: ${{ matrix.group }}
          VALIDATION_EVENT: ${{ needs.plan.outputs.validation_event }}
        run: |
          set -euo pipefail
          selection_args=()
          if [ -n "$VALIDATION_GROUP" ]; then
            selection_args+=(--group "$VALIDATION_GROUP")
          fi
          case "${VALIDATION_EVENT:-}" in
            pull_request | merge_group) selection_args+=(--event "$VALIDATION_EVENT") ;;
          esac
          bash "$RUNNER_TEMP/touchstone-run.sh" prepare \
            --project "$GITHUB_WORKSPACE" \
            ${selection_args[@]+"${selection_args[@]}"} \
            --json

      - name: Identify optional Swift build cache
        id: swift-cache
        if: vars.SWIFT_BUILD_CACHE == 'true' && runner.os == 'Linux' && hashFiles('Package.resolved') != ''
        env:
          CACHE_SKIP_GROUPS: ${{ vars.SWIFT_BUILD_CACHE_SKIP_GROUPS }}
          VALIDATION_GROUP: ${{ matrix.group }}
          CACHE_OS: ${{ runner.os }}
          CACHE_ARCH: ${{ runner.arch }}
          CACHE_GRAPH: ${{ hashFiles('**/Package.swift', '**/Package.resolved', '.swift-version', '.touchstone.toml', 'scripts/ci-setup-swift.sh', 'scripts/swift-check.sh') }}
          CACHE_REVISION: ${{ github.sha }}
          CACHE_EVENT: ${{ github.event_name }}
          CACHE_REF: ${{ github.ref }}
          CACHE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ -n "${VALIDATION_GROUP:-}" ]; then
            case ",${CACHE_SKIP_GROUPS:-}," in
              *,"$VALIDATION_GROUP",*)
                echo "Swift cache skipped for validation group $VALIDATION_GROUP."
                exit 0
                ;;
            esac
          fi
          if ! command -v swift >/dev/null 2>&1; then
            echo "Swift cache skipped: declared setup left no Swift toolchain."
            exit 0
          fi
          toolchain="$(swift --version | sha256sum | cut -d ' ' -f 1)"
          prefix="swiftpm-build-v1-${CACHE_OS}-${CACHE_ARCH}-${toolchain}-${CACHE_GRAPH}-"
          printf 'enabled=true\ntoolchain=%s\nprefix=%s\nkey=%s%s\n' \
            "$toolchain" "$prefix" "$prefix" "$CACHE_REVISION" >>"$GITHUB_OUTPUT"
          save=false
          if [ -n "$CACHE_DEFAULT_BRANCH" ] && [ "$CACHE_REF" = "refs/heads/$CACHE_DEFAULT_BRANCH" ]; then
            case "$CACHE_EVENT" in
              push|workflow_dispatch) save=true ;;
            esac
          fi
          printf 'save=%s\n' "$save" >>"$GITHUB_OUTPUT"

      - name: Restore Swift build cache
        id: restore-swift-cache
        if: steps.swift-cache.outputs.enabled == 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .build
          key: ${{ steps.swift-cache.outputs.key }}
          restore-keys: ${{ steps.swift-cache.outputs.prefix }}

      - name: Run declared validation
        env:
          # Empty for the serial run (cache seeds, engines without a groups
          # inventory); otherwise this shard's declared group name.
          VALIDATION_GROUP: ${{ matrix.group }}
          VALIDATION_EVENT: ${{ needs.plan.outputs.validation_event }}
          TOUCHSTONE_SWIFT_CACHE_KEY: ${{ steps.swift-cache.outputs.key }}
          TOUCHSTONE_SWIFT_CACHE_RESTORED_KEY: ${{ steps.restore-swift-cache.outputs.cache-matched-key }}
        run: |
          set -euo pipefail
          touchstone_sha256="dd1f44b4117d4ccb5634bec4ee6c24b6e3cef5d8eaea8b940edb74b118dbf7f4"
          validator="$RUNNER_TEMP/touchstone-run.sh"
          printf '%s  %s\n' "$touchstone_sha256" "$validator" | sha256sum --check --strict
          selection_args=()
          if [ -n "$VALIDATION_GROUP" ]; then
            selection_args+=(--group "$VALIDATION_GROUP")
          fi
          case "${VALIDATION_EVENT:-}" in
            pull_request | merge_group) selection_args+=(--event "$VALIDATION_EVENT") ;;
          esac
          bash "$RUNNER_TEMP/touchstone-run.sh" validate \
            --project "$GITHUB_WORKSPACE" \
            ${selection_args[@]+"${selection_args[@]}"} \
            --json

      - name: Verify cached toolchain stayed in force
        if: steps.swift-cache.outputs.enabled == 'true'
        env:
          EXPECTED_TOOLCHAIN: ${{ steps.swift-cache.outputs.toolchain }}
        run: |
          set -euo pipefail
          actual="$(swift --version | sha256sum | cut -d ' ' -f 1)"
          if [ "$actual" != "$EXPECTED_TOOLCHAIN" ]; then
            echo "SWIFT_BUILD_CACHE requires validation to retain the prepared Swift toolchain." >&2
            exit 1
          fi

      - name: Save default-branch Swift build cache
        if: success() && matrix.group == '' && steps.swift-cache.outputs.save == 'true' && steps.restore-swift-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .build
          key: ${{ steps.swift-cache.outputs.key }}

  validate:
    # The required check. Reports success only when the plan and every
    # shard succeeded; a failed plan, a failed or skipped shard matrix,
    # and a cancelled run all land as failure here, never as a silent
    # pass. Runs even when a shard failed, so the required context always
    # reports a terminal verdict for the head.
    if: ${{ always() && github.repository != 'autumngarage/touchstone-workflows' }}
    needs: [plan, validate-groups]
    name: validate (ubuntu-latest)
    # Reporting completed shard verdicts needs only a shell.
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Require every validation group
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          GROUPS_RESULT: ${{ needs.validate-groups.result }}
        run: |
          set -euo pipefail
          if [ "$PLAN_RESULT" != success ]; then
            echo "Validation planning did not succeed: $PLAN_RESULT" >&2
            exit 1
          fi
          if [ "$GROUPS_RESULT" != success ]; then
            echo "Declared validation did not succeed in every group: $GROUPS_RESULT" >&2
            exit 1
          fi
          echo "Declared validation succeeded in every group."
