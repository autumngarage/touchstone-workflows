name: review-gate

# Central required review gate for Touchstone consumers, gate behavior
# contract version 3. GitHub runs this pinned source against the target pull
# request and against the merge queue's commit, outside the PR's control. It
# reads the current review surface with the read-only token, runs the pure
# evaluator fetched from Touchstone at a pinned revision, and passes or
# fails. It publishes nothing: the job's own conclusion is the verdict, and
# no workflow in the target repository can forge it.
#
# The contract: one trusted, explicit reviewer verdict bound to the current
# head. Only an unedited clean result succeeds. The gate never adjudicates
# whether historical findings were answered — GitHub's conversation
# resolution rule owns threads, and the merge queue owns the prospective
# merged result — so evidence collection is O(pages of current surfaces),
# never O(review history) (AUT-1132; the 20-request capacity failure this
# replaces was AUT-1106).
#
# Pull-request runs keep an explicit waiting state alive while trusted review
# evidence can still arrive. Terminal evidence failures stop immediately. The
# merge queue never waits: it re-evaluates the PR's current-head verdict once.
#
# DEPENDENCY CONTRACT: the runner image, the target repository, github.com.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  merge_group:
    types: [checks_requested]

concurrency:
  group: review-gate-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read
  issues: read

defaults:
  run:
    shell: bash

jobs:
  review-gate:
    # The source repository's policy requires the source contract published by
    # validate.yml. Keeping one publisher avoids ambiguous duplicate contexts.
    if: github.repository != 'autumngarage/touchstone-workflows'
    name: review-gate
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      TRUSTED_REVIEWERS: chatgpt-codex-connector,chatgpt-codex-connector[bot]
      REVIEW_REQUEST_WAIT_SECONDS: 120
      REVIEW_EVIDENCE_WAIT_SECONDS: 3600
      # Scale boundary: 3 concurrent PRs * 12 polls/hour * the enforced
      # 12 REST requests/evaluation = 432 of the token's 1,000 requests/hour.
      #
      # The ceiling is per EVALUATION and is O(pages), independent of how
      # much review history the pull request carries: 2 fixed reads, up to
      # MAX_EVIDENCE_PAGES each of timeline and issue-comment pages, and one
      # resolution per trusted head-prefix result candidate (normally one).
      # A page bound, unlike the historical per-record work it replaces,
      # cannot be exhausted by accumulating review rounds (AUT-1106).
      REST_REQUEST_LIMIT: 12
      MAX_EVIDENCE_PAGES: 4
      REVIEW_POLL_SECONDS: 300
      # Fallback reviewer. Absent credential = no fallback; the gate then
      # behaves exactly as it did before this step existed.
      OPENROUTER_API: ${{ secrets.OPENROUTER_API }}
      FALLBACK_ENDPOINT: https://openrouter.ai/api/v1/chat/completions
      FALLBACK_MODEL: openrouter/auto
      FALLBACK_PLUGIN: auto-router
      FALLBACK_COST_TIER: low
      FALLBACK_MAX_INPUT_BYTES: 400000
      FALLBACK_MAX_COMPLETION_TOKENS: 4096
      FALLBACK_MAX_PROMPT_PRICE: 0.5
      FALLBACK_MAX_COMPLETION_PRICE: 2
      # A 404 means no provider satisfied the constraints, which happens as
      # provider pricing moves. One retry at a declared higher ceiling keeps
      # delivery moving without making the ceiling permanently looser.
      FALLBACK_RELAXED_PROMPT_PRICE: 2
      FALLBACK_RELAXED_COMPLETION_PRICE: 8
      FALLBACK_CONNECT_TIMEOUT: 10
      FALLBACK_REQUEST_TIMEOUT: 120
    steps:
      - name: Fetch pinned evaluator
        run: |
          set -euo pipefail
          touchstone_revision="aadd2b3d6b83971ca4802b3eee2effac97bd7ce6"
          evaluator_sha256="3b509ed496fd6de055da62a595f21936cc8846be84b8741dee321e09641d64dc"
          curl -fsSL --retry 3 --retry-delay 2 \
            "https://raw.githubusercontent.com/autumngarage/touchstone/${touchstone_revision}/.github/review-gate/evaluate-v3.jq" \
            -o "$RUNNER_TEMP/evaluate-v3.jq"
          echo "${evaluator_sha256}  $RUNNER_TEMP/evaluate-v3.jq" | sha256sum --check --strict

          # The fallback reviewer reuses the local tier's prompt rather than
          # keeping a second copy that can drift from it.
          prompt_revision="9818742198e3cb774a5d3ab5c738cc5985159e36"
          prompt_sha256="bf7024bc8d3a92f2dc264c51c121ce410d32f4f4dbbac6ce731754a5adf8f57a"
          curl -fsSL --retry 3 --retry-delay 2 \
            "https://raw.githubusercontent.com/autumngarage/touchstone/${prompt_revision}/config/review-normal-prompt.md" \
            -o "$RUNNER_TEMP/review-prompt.md"
          echo "${prompt_sha256}  $RUNNER_TEMP/review-prompt.md" | sha256sum --check --strict

      - name: Evaluate review evidence for the pull request
        run: |
          set -euo pipefail
          tmp="$RUNNER_TEMP/evidence"
          mkdir -p "$tmp"

          # Which pull request? A queue commit names it in its branch.
          # touchstone:pr-coordinate:start
          event_pull_request_coordinates() {
            case "${GITHUB_EVENT_NAME}" in
              pull_request)
                jq -ec '
                  {
                    mode: "pull_request",
                    number: .pull_request.number,
                    headSha: .pull_request.head.sha,
                    baseSha: .pull_request.base.sha,
                    baseRef: .pull_request.base.ref
                  }
                  | select(
                      (.number | type == "number" and floor == . and . >= 1)
                      and (.headSha | type == "string" and test("^[0-9a-fA-F]{40}$"))
                      and (.baseSha | type == "string" and test("^[0-9a-fA-F]{40}$"))
                      and (.baseRef | type == "string" and length > 0)
                    )
                ' "$GITHUB_EVENT_PATH"
                ;;
              merge_group)
                queue_ref="$(jq -r '.merge_group.head_ref' "$GITHUB_EVENT_PATH")"
                number="$(printf '%s' "$queue_ref" | sed -nE 's#^refs/heads/gh-readonly-queue/.+/pr-([0-9]+)-[0-9a-fA-F]{40}$#\1#p')"
                ref_base="$(printf '%s' "$queue_ref" | sed -nE 's#^refs/heads/gh-readonly-queue/.+/pr-[0-9]+-([0-9a-fA-F]{40})$#\1#p')"
                head="$(jq -r '.merge_group.head_sha' "$GITHUB_EVENT_PATH")"
                base="$(jq -r '.merge_group.base_sha' "$GITHUB_EVENT_PATH")"
                [ -n "$number" ] || { echo "ERROR: merge group ref '$queue_ref' names no pull request." >&2; return 1; }
                jq -en --argjson number "$number" --arg head "$head" --arg base "$base" --arg refBase "$ref_base" '
                  {
                    mode: "merge_group",
                    number: $number,
                    headSha: $head,
                    baseSha: $base,
                    baseRef: ""
                  }
                  | select(
                      (.headSha | test("^[0-9a-fA-F]{40}$"))
                      and (.baseSha | test("^[0-9a-fA-F]{40}$"))
                      and .baseSha == $refBase
                    )
                '
                ;;
              *) echo "ERROR: unsupported event ${GITHUB_EVENT_NAME}" >&2; return 1 ;;
            esac
          }

          fetch_pull_request() {
            mode="$1"
            requested_number="$2"
            expected_head="$3"
            expected_base_ref="$4"
            output="$5"
            rest_api "repos/$REPO/pulls/$requested_number" >"$output"
            jq -e --arg mode "$mode" --argjson requested "$requested_number" --arg head "$expected_head" --arg baseRef "$expected_base_ref" '
              .number == $requested
              and (.head.sha | type == "string" and test("^[0-9a-fA-F]{40}$"))
              and (.base.sha | type == "string" and test("^[0-9a-fA-F]{40}$"))
              and ($mode != "pull_request" or (.head.sha == $head and .base.ref == $baseRef))
            ' "$output" >/dev/null || {
              echo "ERROR: pull request coordinates do not match event PR $requested_number." >&2
              return 1
            }
          }
          # touchstone:pr-coordinate:end
          event_pull_request_coordinates >"$tmp/event-pr.json"
          event_mode="$(jq -r .mode "$tmp/event-pr.json")"
          number="$(jq -r .number "$tmp/event-pr.json")"
          event_head="$(jq -r .headSha "$tmp/event-pr.json")"
          event_base_ref="$(jq -r .baseRef "$tmp/event-pr.json")"
          event_base="$(jq -r .baseSha "$tmp/event-pr.json")"

          # touchstone:rest-budget:start
          # Every REST request crosses this hard budget boundary, including
          # explicit pagination and the bounded per-candidate resolutions. The
          # counter is file-backed because command substitutions run functions
          # in a subshell; the budget must survive those calls.
          rest_api() {
            local count
            count="$(cat "$tmp/rest-request-count")"
            case "$count" in
              '' | *[!0-9]*) echo "ERROR: invalid REST request counter." >&2; return 1 ;;
            esac
            case "$REST_REQUEST_LIMIT" in
              '' | *[!0-9]* | 0) echo "ERROR: invalid REST request limit." >&2; return 1 ;;
            esac
            if [ "$count" -ge "$REST_REQUEST_LIMIT" ]; then
              echo "ERROR: review evidence requires more than the enforced $REST_REQUEST_LIMIT REST requests per evaluation." >&2
              return 1
            fi
            printf '%s\n' $((count + 1)) >"$tmp/rest-request-count"
            gh api "$@"
          }

          # Paginated collection of one GitHub-owned current surface. The page
          # bound is the supported evidence scale: exceeding it is a distinct
          # budget failure, never a truncated success.
          api_array() {
            local endpoint="$1" output="$2" page=1 page_output page_count
            shift 2
            printf '[]\n' >"$output"
            while :; do
              if [ "$page" -gt "$MAX_EVIDENCE_PAGES" ]; then
                echo "ERROR: ${endpoint%%\?*} exceeds the supported bound of $MAX_EVIDENCE_PAGES evidence pages." >&2
                return 1
              fi
              page_output="$tmp/rest-page.json"
              rest_api "${endpoint}&page=$page" "$@" >"$page_output"
              page_count="$(jq -er 'if type == "array" then length else error("expected an array") end' "$page_output")"
              jq -s '.[0] + .[1]' "$output" "$page_output" >"$output.next"
              mv "$output.next" "$output"
              [ "$page_count" -eq 100 ] || break
              page=$((page + 1))
            done
          }
          # touchstone:rest-budget:end

          # touchstone:abbrev-resolution:start
          # A trusted result comment names an abbreviated commit. Only an
          # abbreviation that is a prefix of the evaluated head is a verdict
          # candidate, and only those candidates are resolved -- normally one
          # per evaluation, never O(result comments). The evaluator accepts a
          # candidate only when its resolution equals the full head, so a
          # mined prefix collision resolves to its true commit and is stale;
          # an unresolvable candidate fails closed there, not here.
          resolve_head_prefix_candidates() {
            local head="$1" issues="$2" output="$3"
            local abbrev resolved
            cp "$issues" "$output"
            while IFS= read -r abbrev; do
              [ -n "$abbrev" ] || continue
              if ! resolved="$(rest_api "repos/$REPO/commits/$abbrev" --jq .sha 2>/dev/null)"; then
                resolved=""
              fi
              jq --arg abbrev "$abbrev" --arg resolved "$resolved" --arg trusted "$TRUSTED_REVIEWERS" '
                ($trusted | split(",")) as $trusted_authors
                | map((.user.login // "") as $login
                    | if (($trusted_authors | index($login)) != null)
                      and (((.body // "") | (capture("Reviewed commit:[*]*[[:space:]]*`(?<sha>[0-9a-fA-F]{7,40})`")? // {sha:""}) | .sha | ascii_downcase) == $abbrev)
                    then . + {resolved_review_sha: $resolved}
                    else . end)' "$output" >"$output.next"
              mv "$output.next" "$output"
            done < <(jq -r --arg trusted "$TRUSTED_REVIEWERS" --arg head "$head" '
                ($head | ascii_downcase) as $h
                | ($trusted | split(",")) as $trusted_authors
                | .[]
                | (.user.login // "") as $login
                | select(($trusted_authors | index($login)) != null)
                | ((.body // "") | (capture("Reviewed commit:[*]*[[:space:]]*`(?<sha>[0-9a-fA-F]{7,40})`")? // {sha:""}) | .sha | ascii_downcase) as $a
                | select($a != "" and ($a | length) < 40 and ($h | startswith($a)))
                | $a' "$issues" \
              | sort -u)
          }
          # touchstone:abbrev-resolution:end

          evaluate_once() {
          printf '0\n' >"$tmp/rest-request-count"
          fetch_pull_request "$event_mode" "$number" "$event_head" "$event_base_ref" "$tmp/pr.json"
          head="$(jq -r '.head.sha' "$tmp/pr.json")"

          api_array "repos/$REPO/issues/$number/timeline?per_page=100" "$tmp/timeline.json" \
            -H 'Accept: application/vnd.github+json'
          base_retargeted_at="$(jq -r '[.[] | select(.event == "base_ref_changed") | .created_at] | max // ""' "$tmp/timeline.json")"

          api_array "repos/$REPO/issues/$number/comments?per_page=100" "$tmp/issues.json"
          resolve_head_prefix_candidates "$head" "$tmp/issues.json" "$tmp/issues-resolved.json"

          # One head must belong to exactly one open pull request.
          rest_api "repos/$REPO/commits/$head/pulls?per_page=100" >"$tmp/head-pulls.json"

          # Formal reviews, bound by GitHub to their commit. One page covers
          # the supported scale; more is a distinct budget failure.
          # shellcheck disable=SC2016
          gh api graphql \
            -f query='query($owner:String!,$repo:String!,$number:Int!){repository(owner:$owner,name:$repo){pullRequest(number:$number){reviews(first:100){nodes{databaseId body state submittedAt updatedAt commit{oid} author{login}} pageInfo{hasNextPage}}}}}' \
            -F owner="${REPO%%/*}" -F repo="${REPO#*/}" -F number="$number" >"$tmp/reviews-response.json"
          jq -e '.data.repository.pullRequest.reviews.pageInfo.hasNextPage == false' "$tmp/reviews-response.json" >/dev/null || {
            echo "ERROR: more than 100 formal reviews exceeds the supported evidence bound." >&2
            return 1
          }
          jq '[.data.repository.pullRequest.reviews.nodes[] | {id: .databaseId, body, state, submitted_at: .submittedAt, updated_at: .updatedAt, commit_id: .commit.oid, user: {login: .author.login}}]' \
            "$tmp/reviews-response.json" >"$tmp/reviews.json"

          jq -n \
            --slurpfile pr "$tmp/pr.json" \
            --slurpfile issueComments "$tmp/issues-resolved.json" \
            --slurpfile reviews "$tmp/reviews.json" \
            --slurpfile headPulls "$tmp/head-pulls.json" \
            --arg trusted "$TRUSTED_REVIEWERS" --arg repo "$REPO" \
            --arg retargetedAt "$base_retargeted_at" \
            '($pr[0]) as $pr | {
              gateBehaviorContractVersion: 3, complete: true,
              trustedAuthors: ($trusted | split(",")),
              pr: {number: $pr.number, state: $pr.state, headSha: $pr.head.sha,
                   baseRef: $pr.base.ref, baseSha: $pr.base.sha,
                   baseRetargetedAt: $retargetedAt,
                   openHeadPulls: [$headPulls[0][] | select(.state == "open" and .base.repo.full_name == $repo and .head.sha == $pr.head.sha) | .number]},
              issueComments: $issueComments[0],
              reviews: $reviews[0]
            }' >"$tmp/evidence.json"

          jq -f "$RUNNER_TEMP/evaluate-v3.jq" "$tmp/evidence.json" >"$tmp/verdict.json"
          }

          # touchstone:provider-state:start
          # A pull request opened by an app has no driver to request review.
          authorless_pull_request() {
            [ -s "$tmp/pr.json" ] || return 1
            jq -e '(.user.type // "") == "Bot" or ((.user.login // "") | endswith("[bot]"))' \
              "$tmp/pr.json" >/dev/null 2>&1
          }

          # An observed state, not an elapsed clock. The reviewer tells us it
          # cannot answer; waiting out the evidence window after that learns
          # nothing. Derived from evidence the evaluation already collected, so
          # it costs no REST request.
          #
          # The rule is recency, not mere presence: the provider is unavailable
          # only when its MOST RECENT utterance is an unavailability notice. A
          # stale notice from an earlier head cannot strand later evaluations,
          # and a verdict posted after a notice supersedes it.
          provider_unavailable() {
            [ -s "$tmp/evidence.json" ] || return 1
            jq -e '
              (.trustedAuthors // []) as $trusted
              | def trusted: select(((.user.login // "") as $l | $trusted | index($l)) != null);
                def at: (.created_at // .submitted_at // .updated_at // "");
                def unavailable:
                  (.body // "")
                  | test("reached your .* usage limits|usage limits for code reviews|Review limit reached|reached its usage spending cap"; "i");
                [ (.issueComments // [])[], (.reviews // [])[] ]
                | map(trusted)
                | map(select(at != ""))
                | sort_by(at)
                | last
                | if . == null then false else unavailable end
            ' "$tmp/evidence.json" >/dev/null 2>&1
          }
          # touchstone:provider-state:end

          # touchstone:review-fallback:start
          # Portable short digest: Linux runners have sha256sum, macOS has
          # shasum. The tests run on either.
          sha16() {
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum | cut -c1-16
            else
              shasum -a 256 | cut -c1-16
            fi
          }

          # A verdict this run COMPUTES, never one it reads back. Nothing new
          # becomes a trusted comment author, so no forged comment can pass the
          # gate. Both pull_request and merge_group derive their own.
          #
          # Fail closed: this returns 0 only on an explicit empty finding set.
          # A missing credential, oversized diff, transport error, malformed
          # body, or any finding all return non-zero, leaving the gate exactly
          # as it behaved before the fallback existed.
          fallback_review() {
            local head="$1" base="$2" work status http body findings

            [ -n "${OPENROUTER_API:-}" ] || {
              echo "Fallback reviewer: no credential configured; not attempting." >&2
              return 1
            }

            work="$RUNNER_TEMP/fallback"
            mkdir -p "$work"

            # The fallback is one terminal phase per run, not a per-poll
            # evaluation, so it opens its own request budget rather than
            # spending what the final evaluation left. Its calls still go
            # through rest_api and remain bounded by REST_REQUEST_LIMIT.
            printf '0\n' >"$tmp/rest-request-count"

            # Bind the review to exactly the range the gate is evaluating.
            if ! rest_api "repos/$REPO/compare/${base}...${head}" \
                 -H "Accept: application/vnd.github.v3.diff" >"$work/diff" 2>"$work/diff.err"; then
              echo "Fallback reviewer: could not fetch the diff for ${base}...${head}." >&2
              return 1
            fi

            if [ ! -s "$work/diff" ]; then
              echo "Fallback reviewer: empty diff; refusing to certify nothing." >&2
              return 1
            fi
            if [ "$(wc -c <"$work/diff")" -gt "$FALLBACK_MAX_INPUT_BYTES" ]; then
              echo "Fallback reviewer: diff exceeds ${FALLBACK_MAX_INPUT_BYTES} bytes; not attempting." >&2
              return 1
            fi

            jq -n \
              --rawfile system "$RUNNER_TEMP/review-prompt.md" \
              --rawfile diff "$work/diff" \
              --arg model "$FALLBACK_MODEL" \
              --arg plugin "$FALLBACK_PLUGIN" \
              --arg costTier "$FALLBACK_COST_TIER" \
              --arg head "$head" \
              --argjson maxCompletionTokens "$FALLBACK_MAX_COMPLETION_TOKENS" \
              --argjson maxPromptPrice "$FALLBACK_MAX_PROMPT_PRICE" \
              --argjson maxCompletionPrice "$FALLBACK_MAX_COMPLETION_PRICE" \
              '{
                model: $model,
                messages: [
                  {role: "system", content: $system},
                  {role: "user", content: ("Review the pushed head " + $head + ".\n\n" + $diff)}
                ],
                plugins: [{id: $plugin, cost_tier: $costTier}],
                provider: {
                  require_parameters: true,
                  max_price: {prompt: $maxPromptPrice, completion: $maxCompletionPrice}
                },
                max_completion_tokens: $maxCompletionTokens,
                usage: {include: true},
                response_format: {
                  type: "json_schema",
                  json_schema: {
                    name: "touchstone_code_review",
                    strict: true,
                    schema: {
                      type: "object",
                      additionalProperties: false,
                      required: ["summary", "findings"],
                      properties: {
                        summary: {type: "string"},
                        findings: {
                          type: "array",
                          maxItems: 100,
                          items: {
                            type: "object",
                            additionalProperties: false,
                            required: ["severity", "file", "line", "title", "body"],
                            properties: {
                              severity: {type: "string", enum: ["P0","P1","P2","P3"]},
                              file: {type: "string"},
                              line: {type: ["integer","null"], minimum: 1},
                              title: {type: "string"},
                              body: {type: "string"}
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }' >"$work/request.json"

            # The credential goes in a private config file, never in argv,
            # where the runner process list would expose it.
            umask 077
            printf 'header = "Authorization: Bearer %s"\n' "$OPENROUTER_API" >"$work/curl.conf"

            # Transport and metered failures are terminal: a retry doubles
            # spend for the same outage. An empty completion is different --
            # the request succeeded and was billed, and produced nothing, so
            # the spend is already sunk. openrouter/auto selects per request,
            # so a second attempt usually lands on a model that answers.
            # Exactly one extra attempt, and only for that case.
            body=""
            attempt=1
            relaxed=false
            while :; do
              status=0
              http="$(curl -sS -o "$work/response.json" -w '%{http_code}' \
                --config "$work/curl.conf" \
                --connect-timeout "$FALLBACK_CONNECT_TIMEOUT" \
                --max-time "$FALLBACK_REQUEST_TIMEOUT" \
                -H "Content-Type: application/json" \
                -X POST --data @"$work/request.json" \
                "$FALLBACK_ENDPOINT" 2>"$work/curl.err")" || status=$?

              if [ "$status" -ne 0 ] || [ "$http" != "200" ]; then
                if [ "$http" = "404" ] && [ "$relaxed" = false ]; then
                  # The router matched no provider satisfying every constraint.
                  # OpenRouter documents this as a 404, and a cost tier is a
                  # band rather than a ceiling, so max_price is what empties
                  # the set as provider pricing moves. Retry once at a declared
                  # higher ceiling instead of blocking delivery on a pricing
                  # shift; the ceiling stays bounded and the cost is reported.
                  echo "Fallback reviewer: no provider satisfied the price ceilings (404); retrying once at prompt ${FALLBACK_RELAXED_PROMPT_PRICE}, completion ${FALLBACK_RELAXED_COMPLETION_PRICE} per million." >&2
                  relaxed=true
                  jq --argjson p "$FALLBACK_RELAXED_PROMPT_PRICE" --argjson c "$FALLBACK_RELAXED_COMPLETION_PRICE" \
                    '.provider.max_price = {prompt: $p, completion: $c}' \
                    "$work/request.json" >"$work/request.relaxed.json" \
                    && mv "$work/request.relaxed.json" "$work/request.json"
                  continue
                elif [ "$http" = "404" ]; then
                  echo "Fallback reviewer: no provider satisfied the constraints even at the relaxed ceiling (404); require_parameters admits nothing right now." >&2
                else
                  echo "Fallback reviewer: request failed (http=${http:-none}, curl=${status})." >&2
                fi
                rm -f "$work/curl.conf"
                return 1
              fi

              # A 200 can carry an error instead of a completion: the router
              # returns rate limits and provider failures that way. Treated as
              # an empty completion it looks like model variance, gets one
              # pointless retry, and reports nothing anyone can act on.
              api_error="$(jq -r '(.error.message // .error // empty) | tostring' "$work/response.json" 2>/dev/null || true)"
              if [ -n "$api_error" ] && [ "$api_error" != "null" ]; then
                echo "Fallback reviewer: provider returned an error in a 200 response: ${api_error}" >&2
                rm -f "$work/curl.conf"
                return 1
              fi

              body="$(jq -r '.choices[0].message.content // empty' "$work/response.json" 2>/dev/null || true)"
              if [ -n "$body" ]; then
                # Spend is invisible unless it is reported. This runs on every
                # pull request and again per merge group while the primary
                # reviewer is down, so the per-run cost is worth seeing.
                jq -r '"Fallback reviewer cost: model=" + (.model // "?")
                       + " prompt=" + ((.usage.prompt_tokens // 0) | tostring)
                       + " completion=" + ((.usage.completion_tokens // 0) | tostring)
                       + " usd=" + ((.usage.cost // 0) | tostring)' \
                  "$work/response.json" 2>/dev/null || true
                break
              fi

              # Name what answered and why it stopped; an unexplained empty
              # completion is undiagnosable after the fact.
              jq -r '"  model=" + (.model // "?") + " finish=" + (.choices[0].finish_reason // "?")
                     + " native=" + (.choices[0].native_finish_reason // "?")
                     + " error=" + ((.error // {}) | tostring | .[0:200])' \
                "$work/response.json" 2>/dev/null >&2 || true

              if [ "$attempt" -ge 2 ]; then
                echo "Fallback reviewer: response carried no content after $attempt attempts." >&2
                rm -f "$work/curl.conf"
                return 1
              fi
              echo "Fallback reviewer: empty completion; one further attempt." >&2
              attempt=$((attempt + 1))
            done
            rm -f "$work/curl.conf"

            if ! printf '%s' "$body" | jq -e 'has("findings") and (.findings | type == "array")' >/dev/null 2>&1; then
              echo "Fallback reviewer: malformed review body; not a verdict." >&2
              return 1
            fi

            findings="$(printf '%s' "$body" | jq '.findings | length')"
            blocking="$(printf '%s' "$body" | jq '[.findings[] | select(.severity == "P0" or .severity == "P1")] | length')"
            printf '%s' "$body" | jq -r '"Fallback reviewer summary: " + (.summary // "")'

            if [ "$findings" -eq 0 ]; then
              echo "Fallback reviewer: clean verdict for ${head}."
              return 0
            fi

            # The job summary is reachable only in the UI, so the complete
            # finding goes to the log, which the API serves. An agent that
            # cannot read the detail cannot act on it.
            printf '%s' "$body" | jq -r '.findings[] |
              "  [" + .severity + "] " + .file + ":" + ((.line // 1) | tostring) + " — " + .title
              + "\n      " + (.body | gsub("\n"; "\n      "))'

            # Findings become review threads, the same object the primary
            # reviewer produces, so the driver's existing answer-and-resolve
            # flow works unchanged. A thread cannot forge a pass -- it can only
            # add something GitHub blocks merge on -- so the in-run verdict
            # rule that governs the pass does not apply to findings.
            write_fallback_summary "$head" "$body" || true

            # The gate is read-only by design, so it cannot open review threads
            # and there is no answer-and-resolve flow to lean on. The severity
            # bar therefore has to be applied here: P0/P1 close the gate, and
            # P2/P3 are reported without blocking.
            if [ "$blocking" -gt 0 ]; then
              echo "Fallback reviewer: ${blocking} P0/P1 finding(s) for ${head}; gate stays closed." >&2
              return 1
            fi
            echo "Fallback reviewer: ${findings} finding(s), none above P1, for ${head}; reported without blocking."
            return 0
          }

          # Findings land in the run's job summary: visible on the pull
          # request's checks tab, one place, and needing no write permission.
          write_fallback_summary() {
            local head="$1" body="$2"
            [ -n "${GITHUB_STEP_SUMMARY:-}" ] || return 0
            {
              printf '### Fallback review — %s\n\n' "$head"
              printf '%s' "$body" | jq -r '"_" + (.summary // "") + "_\n"'
              printf '%s' "$body" | jq -r '.findings[] |
                "- **" + .severity + "** `" + .file + ":" + ((.line // 1) | tostring) + "` — " + .title + "\n  " + .body'
              printf '\n_The primary reviewer was unavailable, so the pinned review-gate workflow reviewed this head. '
              printf 'P0 and P1 close the gate; P2 and P3 are reported only._\n'
            } >>"$GITHUB_STEP_SUMMARY"
          }

          # How many findings are not yet answered? A resolved thread carrying

          # One inline review thread per finding, so each can be answered and
          # resolved. Idempotent per head: a marker carries the head and a

          # touchstone:review-fallback:end

          # touchstone:review-wait:start
          review_gate_now() { date +%s; }
          review_gate_sleep() { sleep "$1"; }

          wait_for_review_gate() {
            now="$(review_gate_now)"
            request_deadline=$((now + REVIEW_REQUEST_WAIT_SECONDS))
            review_deadline=0
            previous_state=""

            while :; do
              evaluate_once
              state="$(jq -er '.state | select(type == "string" and length > 0)' "$tmp/verdict.json")"

              if [ "$state" != "$previous_state" ]; then
                jq -r '.summary' "$tmp/verdict.json"
                previous_state="$state"
              fi

              case "$state" in
                success) return 0 ;;
                failure) return 1 ;;
                waiting-request | waiting-review) ;;
                *) echo "ERROR: evaluator returned unsupported state '$state'." >&2; return 1 ;;
              esac

              if [ "$event_mode" != pull_request ]; then
                echo "Merge-group review evidence is incomplete; queue evaluation never waits." >&2
                if fallback_review "${event_head:-}" "${event_base:-}"; then
                  echo "Merge group satisfied by the fallback reviewer for ${event_head:-}."
                  return 0
                fi
                echo "ERROR: merge-group review evidence is incomplete and no fallback verdict was obtained." >&2
                return 1
              fi

              if [ "$state" = waiting-review ] && provider_unavailable; then
                echo "Trusted reviewer reported it cannot review this head; not waiting out the evidence window."
                if fallback_review "${event_head:-}" "${event_base:-}"; then
                  echo "Gate satisfied by the fallback reviewer for ${event_head:-}."
                  return 0
                fi
                echo "ERROR: trusted reviewer unavailable and no fallback verdict for ${event_head:-}." >&2
                return 1
              fi

              now="$(review_gate_now)"
              case "$state" in
                waiting-request)
                  deadline="$request_deadline"
                  ;;
                waiting-review)
                  # A request grants the complete review window from the
                  # moment the gate first observes it.
                  if [ "$review_deadline" -eq 0 ]; then
                    review_deadline=$((now + REVIEW_EVIDENCE_WAIT_SECONDS))
                  fi
                  deadline="$review_deadline"
                  ;;
              esac
              remaining=$((deadline - now))
              if [ "$remaining" -le 0 ]; then
                echo "Review gate remained '$state' until its evidence deadline." >&2
                # waiting-request too, but only when the reviewer has said it
                # cannot answer. Dependabot pull requests never get a request
                # posted for them, so they would otherwise sit here forever.
                # Without that condition this would excuse a driver that simply
                # never requested review.
                # waiting-request means no review was ever requested. That is
                # a driver failure and stays one -- unless there is no driver:
                # a bot-authored pull request (Dependabot) has nobody to post
                # the request, and nobody for the reviewer to answer, so the
                # unavailability signal can never appear on it either.
                if { [ "$state" = waiting-review ] \
                     || { [ "$state" = waiting-request ] && { provider_unavailable || authorless_pull_request; }; }; } \
                   && fallback_review "${event_head:-}" "${event_base:-}"; then
                  echo "Gate satisfied by the fallback reviewer for ${event_head:-}."
                  return 0
                fi
                echo "ERROR: no trusted verdict and no fallback verdict for ${event_head:-}." >&2
                return 1
              fi

              sleep_seconds="$REVIEW_POLL_SECONDS"
              [ "$sleep_seconds" -le "$remaining" ] || sleep_seconds="$remaining"
              echo "Review gate is '$state'; re-evaluating in ${sleep_seconds}s (${remaining}s remain)."
              review_gate_sleep "$sleep_seconds"
            done
          }
          # touchstone:review-wait:end

          wait_for_review_gate
