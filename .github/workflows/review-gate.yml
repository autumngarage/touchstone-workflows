name: review-gate

# Central required review gate for Touchstone consumers. GitHub runs this
# pinned source against the target pull request and against the merge
# queue's commit, outside the PR's control. It reads evidence with the
# read-only token, runs the pure evaluator fetched from Touchstone at a
# pinned revision, and passes or fails. It publishes nothing: the job's own
# conclusion is the verdict, and no workflow in the target repository can
# forge it.
#
# Pull-request runs keep an explicit waiting state alive while trusted review
# evidence can still arrive. Terminal evidence failures stop immediately. The
# merge queue never waits: it re-evaluates the complete merged result once.
#
# DEPENDENCY CONTRACT: the runner image, the target repository, github.com.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  merge_group:
    types: [checks_requested]

concurrency:
  group: review-gate-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read
  issues: read

defaults:
  run:
    shell: bash

jobs:
  review-gate:
    # The source repository's policy requires the source contract published by
    # validate.yml. Keeping one publisher avoids ambiguous duplicate contexts.
    if: github.repository != 'autumngarage/touchstone-workflows'
    name: review-gate
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      TRUSTED_REVIEWERS: chatgpt-codex-connector,chatgpt-codex-connector[bot]
      REVIEW_REQUEST_WAIT_SECONDS: 120
      REVIEW_EVIDENCE_WAIT_SECONDS: 3600
      # Scale boundary: 3 concurrent PRs * 12 polls/hour * the enforced
      # 20 REST requests/evaluation = 720 of the token's 1,000 requests/hour.
      REST_REQUEST_LIMIT: 20
      REVIEW_POLL_SECONDS: 300
    steps:
      - name: Fetch pinned evaluator
        run: |
          set -euo pipefail
          touchstone_revision="0faa4c691a0a9b70a6045bfe39f8011401b2443f"
          evaluator_sha256="e646d86342830f5db462417127d1f821a9c7ea020418d5dc896d93e74c07c44c"
          curl -fsSL --retry 3 --retry-delay 2 \
            "https://raw.githubusercontent.com/autumngarage/touchstone/${touchstone_revision}/.github/review-gate/evaluate.jq" \
            -o "$RUNNER_TEMP/evaluate.jq"
          echo "${evaluator_sha256}  $RUNNER_TEMP/evaluate.jq" | sha256sum --check --strict

      - name: Evaluate review evidence for the pull request
        run: |
          set -euo pipefail
          tmp="$RUNNER_TEMP/evidence"
          mkdir -p "$tmp"

          # Which pull request? A queue commit names it in its branch.
          # touchstone:pr-coordinate:start
          event_pull_request_coordinates() {
            case "${GITHUB_EVENT_NAME}" in
              pull_request)
                jq -ec '
                  {
                    mode: "pull_request",
                    number: .pull_request.number,
                    headSha: .pull_request.head.sha,
                    baseSha: .pull_request.base.sha,
                    baseRef: .pull_request.base.ref
                  }
                  | select(
                      (.number | type == "number" and floor == . and . >= 1)
                      and (.headSha | type == "string" and test("^[0-9a-fA-F]{40}$"))
                      and (.baseSha | type == "string" and test("^[0-9a-fA-F]{40}$"))
                      and (.baseRef | type == "string" and length > 0)
                    )
                ' "$GITHUB_EVENT_PATH"
                ;;
              merge_group)
                queue_ref="$(jq -r '.merge_group.head_ref' "$GITHUB_EVENT_PATH")"
                number="$(printf '%s' "$queue_ref" | sed -nE 's#^refs/heads/gh-readonly-queue/.+/pr-([0-9]+)-[0-9a-fA-F]{40}$#\1#p')"
                ref_base="$(printf '%s' "$queue_ref" | sed -nE 's#^refs/heads/gh-readonly-queue/.+/pr-[0-9]+-([0-9a-fA-F]{40})$#\1#p')"
                head="$(jq -r '.merge_group.head_sha' "$GITHUB_EVENT_PATH")"
                base="$(jq -r '.merge_group.base_sha' "$GITHUB_EVENT_PATH")"
                [ -n "$number" ] || { echo "ERROR: merge group ref '$queue_ref' names no pull request." >&2; return 1; }
                jq -en --argjson number "$number" --arg head "$head" --arg base "$base" --arg refBase "$ref_base" '
                  {
                    mode: "merge_group",
                    number: $number,
                    headSha: $head,
                    baseSha: $base,
                    baseRef: ""
                  }
                  | select(
                      (.headSha | test("^[0-9a-fA-F]{40}$"))
                      and (.baseSha | test("^[0-9a-fA-F]{40}$"))
                      and .baseSha == $refBase
                    )
                '
                ;;
              *) echo "ERROR: unsupported event ${GITHUB_EVENT_NAME}" >&2; return 1 ;;
            esac
          }

          fetch_pull_request() {
            mode="$1"
            requested_number="$2"
            expected_head="$3"
            expected_base_ref="$4"
            output="$5"
            rest_api "repos/$REPO/pulls/$requested_number" >"$output"
            jq -e --arg mode "$mode" --argjson requested "$requested_number" --arg head "$expected_head" --arg baseRef "$expected_base_ref" '
              .number == $requested
              and (.head.sha | type == "string" and test("^[0-9a-fA-F]{40}$"))
              and (.base.sha | type == "string" and test("^[0-9a-fA-F]{40}$"))
              and ($mode != "pull_request" or (.head.sha == $head and .base.ref == $baseRef))
            ' "$output" >/dev/null || {
              echo "ERROR: pull request coordinates do not match event PR $requested_number." >&2
              return 1
            }
          }
          # touchstone:pr-coordinate:end
          event_pull_request_coordinates >"$tmp/event-pr.json"
          event_mode="$(jq -r .mode "$tmp/event-pr.json")"
          number="$(jq -r .number "$tmp/event-pr.json")"
          event_head="$(jq -r .headSha "$tmp/event-pr.json")"
          event_base_ref="$(jq -r .baseRef "$tmp/event-pr.json")"

          # touchstone:permission-collector:start
          # Every REST request crosses this hard budget boundary, including
          # explicit pagination and dynamic per-record lookups. The counter is
          # file-backed because command substitutions run functions in a
          # subshell; the budget must survive those calls.
          rest_api() {
            local count
            count="$(cat "$tmp/rest-request-count")"
            case "$count" in
              '' | *[!0-9]*) : >"$tmp/rest-budget-exhausted"; echo "ERROR: invalid REST request counter." >&2; return 1 ;;
            esac
            case "$REST_REQUEST_LIMIT" in
              '' | *[!0-9]* | 0) : >"$tmp/rest-budget-exhausted"; echo "ERROR: invalid REST request limit." >&2; return 1 ;;
            esac
            if [ "$count" -ge "$REST_REQUEST_LIMIT" ]; then
              : >"$tmp/rest-budget-exhausted"
              echo "ERROR: review evidence requires more than the enforced $REST_REQUEST_LIMIT REST requests per evaluation." >&2
              return 1
            fi
            printf '%s\n' $((count + 1)) >"$tmp/rest-request-count"
            gh api "$@"
          }

          api_array() {
            local endpoint="$1" output="$2" page=1 page_output page_count
            shift 2
            printf '[]\n' >"$output"
            while :; do
              page_output="$tmp/rest-page.json"
              rest_api "${endpoint}&page=$page" "$@" >"$page_output"
              page_count="$(jq -er 'if type == "array" then length else error("expected an array") end' "$page_output")"
              jq -s '.[0] + .[1]' "$output" "$page_output" >"$output.next"
              mv "$output.next" "$output"
              [ "$page_count" -eq 100 ] || break
              page=$((page + 1))
            done
          }

          response_body() {
            awk 'body { print; next } { line = $0; sub(/\r$/, "", line); if (line == "") body = 1 }' "$1"
          }

          collect_author_permissions() {
            issue_comments="$1"
            review_comments="$2"
            output="$3"
            printf '{}\n' >"$output"

            jq -r -s '
              ([.[0][]?
                | select(
                    ((.body // "") | test("^[[:space:]]*@codex[[:space:]]+review([[:space:]]|$)"; "i"))
                    or ((.body // "") | test("<!--[[:space:]]*touchstone:review-answer id=[0-9]+[[:space:]]*-->")))
                | .user.login // empty]
               + [.[1][]? | select(.in_reply_to_id != null) | .user.login // empty])
              | unique[]
            ' "$issue_comments" "$review_comments" |
              while IFS= read -r login; do
                response="$tmp/permission-response.json"
                error="$tmp/permission-error.txt"
                if rest_api --include "repos/$REPO/collaborators/$login/permission" >"$response" 2>"$error"; then
                  if ! permission="$(response_body "$response" | jq -er '.permission | select(type == "string" and length > 0)')"; then
                    echo "ERROR: malformed effective permission response for '$login'." >&2
                    return 1
                  fi
                else
                  status="$(sed -n '1s/^HTTP\/[^ ]* \([0-9][0-9][0-9]\).*/\1/p' "$response")"
                  if [ "$status" = 404 ]; then
                    permission=none
                  else
                    echo "ERROR: cannot resolve effective repository permission for '$login' (HTTP ${status:-transport failure})." >&2
                    cat "$error" >&2
                    return 1
                  fi
                fi
                jq --arg login "$login" --arg permission "$permission" \
                  '. + {($login): $permission}' "$output" >"$output.next"
                mv "$output.next" "$output"
              done
          }
          # touchstone:permission-collector:end

          evaluate_once() {
          rm -f "$tmp/rest-budget-exhausted"
          printf '0\n' >"$tmp/rest-request-count"
          fetch_pull_request "$event_mode" "$number" "$event_head" "$event_base_ref" "$tmp/pr.json"
          head="$(jq -r '.head.sha' "$tmp/pr.json")"
          base="$(jq -r '.base.sha' "$tmp/pr.json")"
          # When did this SHA last become the head? Its commit date, or the
          # force-push that restored it -- a bare request binds only a head
          # current when it was posted. And a bare request cannot outlive a
          # base retarget: the reviewer never saw the new base's diff.
          head_committed_at="$(rest_api "repos/$REPO/commits/$head" --jq '.commit.committer.date')"
          api_array "repos/$REPO/issues/$number/timeline?per_page=100" "$tmp/timeline.json" \
            -H 'Accept: application/vnd.github+json'
          head_current_since="$(jq -r --arg committed "$head_committed_at" \
            '([.[] | select(.event == "head_ref_force_pushed") | .created_at] + [$committed]) | max' "$tmp/timeline.json")"
          base_retargeted_at="$(jq -r '[.[] | select(.event == "base_ref_changed") | .created_at] | max // ""' "$tmp/timeline.json")"

          api_array "repos/$REPO/issues/$number/comments?per_page=100" "$tmp/issues.json"
          api_array "repos/$REPO/pulls/$number/comments?per_page=100" "$tmp/review-comments.json"
          collect_author_permissions "$tmp/issues.json" "$tmp/review-comments.json" "$tmp/author-permissions.json"
          api_array "repos/$REPO/commits/$head/pulls?per_page=100" "$tmp/head-pulls.json"
          # shellcheck disable=SC2016
          gh api graphql --paginate \
            -f query='query($owner:String!,$repo:String!,$number:Int!,$endCursor:String){repository(owner:$owner,name:$repo){pullRequest(number:$number){reviews(first:100,after:$endCursor){nodes{databaseId body state submittedAt updatedAt commit{oid} author{login}} pageInfo{hasNextPage endCursor}}}}}' \
            -F owner="${REPO%%/*}" -F repo="${REPO#*/}" -F number="$number" \
            | jq -s '[.[].data.repository.pullRequest.reviews.nodes[] | {id: .databaseId, body, state, submitted_at: .submittedAt, updated_at: .updatedAt, commit_id: .commit.oid, user: {login: .author.login}}]' \
            >"$tmp/reviews.json"

          # Trusted result comments name an abbreviated commit; resolve it so
          # the evaluator compares full SHAs.
          printf '{}\n' >"$tmp/resolved.json"
          while IFS=$'\t' read -r id abbreviated || [ -n "$id" ]; do
            [ -n "$id" ] || continue
            if [ "${#abbreviated}" -eq 40 ]; then resolved="$abbreviated"
            elif ! resolved="$(rest_api "repos/$REPO/commits/$abbreviated" --jq .sha 2>/dev/null)"; then
              [ ! -f "$tmp/rest-budget-exhausted" ] || return 1
              echo "WARNING: trusted comment $id names unresolvable commit $abbreviated; ignored." >&2; resolved=""
            fi
            jq --arg id "$id" --arg sha "$resolved" '. + {($id): $sha}' "$tmp/resolved.json" >"$tmp/resolved.next" && mv "$tmp/resolved.next" "$tmp/resolved.json"
          done < <(jq -r --arg trusted "$TRUSTED_REVIEWERS" '.[] | (.user.login // "") as $login | select(($trusted | split(",") | index($login)) != null) | ((.body // "") | capture("Reviewed commit:[*]*[[:space:]]*`(?<sha>[0-9a-fA-F]{7,40})`")?) as $m | select($m != null) | [(.id | tostring), $m.sha] | @tsv' "$tmp/issues.json")
          jq --slurpfile resolved "$tmp/resolved.json" 'map(. + {resolved_review_sha: ($resolved[0][(.id | tostring)] // "")})' "$tmp/issues.json" >"$tmp/issues-resolved.json"

          # A request binds the base it was made against or any ancestor of
          # the current tip; the default branch advancing does not unmake it.
          printf '["%s"]' "$base" >"$tmp/bases.json"
          while IFS= read -r request_base; do
            [ -n "$request_base" ] && [ "$request_base" != "$base" ] || continue
            if ! status="$(rest_api "repos/$REPO/compare/$request_base...$base" --jq .status 2>/dev/null)"; then
              [ ! -f "$tmp/rest-budget-exhausted" ] || return 1
              status=unknown
            fi
            case "$status" in identical | ahead)
              jq --arg sha "$request_base" '. + [$sha]' "$tmp/bases.json" >"$tmp/bases.next" && mv "$tmp/bases.next" "$tmp/bases.json" ;;
            esac
          done < <(jq -r '.[] | (.body // "") | capture("touchstone:pr-open head=[0-9a-fA-F]{40} base=[^ ]+ base_sha=(?<b>[0-9a-fA-F]{40})")? | .b' "$tmp/issues.json" | sort -u)

          jq -n \
            --slurpfile pr "$tmp/pr.json" --slurpfile issueComments "$tmp/issues-resolved.json" \
            --slurpfile reviews "$tmp/reviews.json" --slurpfile reviewComments "$tmp/review-comments.json" \
            --slurpfile headPulls "$tmp/head-pulls.json" --slurpfile bases "$tmp/bases.json" \
            --slurpfile authorPermissions "$tmp/author-permissions.json" \
            --arg trusted "$TRUSTED_REVIEWERS" --arg repo "$REPO" --arg currentSince "$head_current_since" --arg retargetedAt "$base_retargeted_at" \
            '($pr[0]) as $pr | {
              contractVersion: 3, complete: true,
              trustedAuthors: ($trusted | split(",")),
              authorPermissions: $authorPermissions[0],
              pr: {number: $pr.number, state: $pr.state, headSha: $pr.head.sha, baseRef: $pr.base.ref, baseSha: $pr.base.sha,
                   acceptableBaseShas: $bases[0], headCurrentSince: $currentSince, baseRetargetedAt: $retargetedAt,
                   openHeadPulls: [$headPulls[0][] | select(.state == "open" and .base.repo.full_name == $repo and .head.sha == $pr.head.sha) | .number]},
              issueComments: $issueComments[0], reviews: $reviews[0], reviewComments: $reviewComments[0]
            }' >"$tmp/evidence.json"

          jq -f "$RUNNER_TEMP/evaluate.jq" "$tmp/evidence.json" >"$tmp/verdict.json"
          }

          # touchstone:review-wait:start
          review_gate_now() { date +%s; }
          review_gate_sleep() { sleep "$1"; }

          wait_for_review_gate() {
            now="$(review_gate_now)"
            request_deadline=$((now + REVIEW_REQUEST_WAIT_SECONDS))
            review_deadline=0
            previous_state=""
            deadline=0

            while :; do
              if [ "$deadline" -gt 0 ]; then
                now="$(review_gate_now)"
                if [ "$now" -ge "$deadline" ]; then
                  echo "ERROR: review gate remained '$previous_state' until its evidence deadline." >&2
                  return 1
                fi
              fi
              evaluate_once
              state="$(jq -er '.state | select(type == "string" and length > 0)' "$tmp/verdict.json")"

              if [ "$state" != "$previous_state" ]; then
                jq -r '.summary' "$tmp/verdict.json"
                previous_state="$state"
              fi

              case "$state" in
                success) return 0 ;;
                failure) return 1 ;;
                waiting-request | waiting-review) ;;
                *) echo "ERROR: evaluator returned unsupported state '$state'." >&2; return 1 ;;
              esac

              if [ "$event_mode" != pull_request ]; then
                echo "ERROR: merge-group review evidence is incomplete; queue evaluation never waits." >&2
                return 1
              fi

              now="$(review_gate_now)"
              case "$state" in
                waiting-request)
                  deadline="$request_deadline"
                  ;;
                waiting-review)
                  if [ "$review_deadline" -eq 0 ]; then
                    review_deadline=$((now + REVIEW_EVIDENCE_WAIT_SECONDS))
                  fi
                  deadline="$review_deadline"
                  ;;
              esac
              remaining=$((deadline - now))
              if [ "$remaining" -le 0 ]; then
                echo "ERROR: review gate remained '$state' until its evidence deadline." >&2
                return 1
              fi

              sleep_seconds="$REVIEW_POLL_SECONDS"
              [ "$sleep_seconds" -le "$remaining" ] || sleep_seconds="$remaining"
              echo "Review gate is '$state'; re-evaluating in ${sleep_seconds}s (${remaining}s remain)."
              review_gate_sleep "$sleep_seconds"
            done
          }
          # touchstone:review-wait:end

          wait_for_review_gate
